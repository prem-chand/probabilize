<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="240" viewBox="0 0 460 240">
<rect width="460" height="240" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(5 10)">
  
  <line x1="50" y1="170" x2="410" y2="170" stroke="var(--border-default)" stroke-width="1.5"/>
  <line x1="50" y1="170" x2="50" y2="40" stroke="var(--border-subtle)" stroke-width="1.5"/>
  <path d="M60 168 C 150 166, 200 60, 235 58 C 280 56, 330 150, 400 168" stroke="var(--figure-structure)" stroke-width="2" fill="none"/>
  <line x1="235" y1="58" x2="235" y2="170" stroke="var(--figure-flow)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="235" cy="58" r="4.5" fill="var(--figure-flow)"/>
  <line x1="300" y1="110" x2="300" y2="170" stroke="var(--figure-accent)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="235" y="46" text-anchor="middle" fill="var(--figure-flow)" font-family="var(--font-mono)" font-size="10">MLE: p̂</text>
  <text x="300" y="186" text-anchor="middle" fill="var(--figure-accent)" font-family="var(--font-mono)" font-size="10">true p</text>
  <text x="150" y="150" fill="var(--figure-structure)" font-family="var(--font-mono)" font-size="10">ℓ(p) = log L(p)</text>
  <text x="225" y="26" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="11">maximum likelihood: the parameter that makes data most probable</text>
  <text x="225" y="205" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">the peak is the estimator; the curvature around it sets the uncertainty</text>
</g>
</svg>