<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 220" fill="none">
  <rect width="450" height="220" fill="var(--surface-sunken, #07090c)" rx="14"/>
  <line x1="50" y1="170" x2="410" y2="170" stroke="var(--border-default, #343a48)" stroke-width="1.4"/>
  <line x1="50" y1="170" x2="50" y2="40" stroke="var(--border-subtle, #21262f)" stroke-width="1.2"/>
  <path d="M60 168 C 150 166, 200 60, 235 58 C 280 56, 330 150, 400 168" stroke="#5879fb" stroke-width="2.2" fill="none"/>
  <line x1="235" y1="58" x2="235" y2="170" stroke="#16a36b" stroke-width="1.4" stroke-dasharray="4 4"/>
  <circle cx="235" cy="58" r="4.5" fill="#16a36b"/>
  <line x1="300" y1="110" x2="300" y2="170" stroke="#f5a623" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="235" y="46" text-anchor="middle" fill="#16a36b" font-family="monospace" font-size="10">MLE: p̂</text>
  <text x="300" y="186" text-anchor="middle" fill="#f5a623" font-family="monospace" font-size="10">true p</text>
  <text x="150" y="150" fill="#5879fb" font-family="monospace" font-size="10">ℓ(p) = log L(p)</text>
  <text x="225" y="26" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="11">maximum likelihood: the parameter that makes data most probable</text>
  <text x="225" y="205" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">the peak is the estimator; the curvature around it sets the uncertainty</text>
</svg>
