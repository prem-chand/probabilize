<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="300" viewBox="0 0 460 300">
<rect width="460" height="300" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(20 20)">
  
  <g stroke="var(--border-subtle)" stroke-width="1.5">
    <ellipse cx="110" cy="150" rx="46" ry="32"/><ellipse cx="110" cy="150" rx="26" ry="18"/>
    <ellipse cx="110" cy="90" rx="46" ry="32"/><ellipse cx="110" cy="90" rx="26" ry="18"/>
    <ellipse cx="110" cy="210" rx="46" ry="32"/><ellipse cx="110" cy="210" rx="26" ry="18"/>
  </g>
  <g fill="var(--figure-flow)"><circle cx="110" cy="90" r="5"/><circle cx="110" cy="210" r="5"/></g>
  <circle cx="110" cy="150" r="5" fill="var(--figure-alert)"/>
  <g fill="var(--figure-accent)"><circle cx="70" cy="150" r="5"/><circle cx="150" cy="150" r="5"/></g>
  <text x="240" y="94" fill="var(--figure-flow)" font-family="var(--font-mono)" font-size="10">minima (H ≻ 0)</text>
  <text x="240" y="154" fill="var(--figure-alert)" font-family="var(--font-mono)" font-size="10">maximum (H ≺ 0)</text>
  <text x="240" y="214" fill="var(--figure-accent)" font-family="var(--font-mono)" font-size="10">saddles (H indefinite)</text>
  <text x="210" y="26" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="11">∇f = 0 is necessary but not sufficient — curvature decides</text>
  <text x="210" y="248" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">first order finds candidates; the Hessian classifies them</text>
</g>
</svg>