  <rect width="420" height="260" fill="var(--surface-sunken, #07090c)" rx="14"/>
  <g stroke="var(--border-subtle, #21262f)" stroke-width="1.2">
    <ellipse cx="110" cy="150" rx="46" ry="32"/><ellipse cx="110" cy="150" rx="26" ry="18"/>
    <ellipse cx="110" cy="90" rx="46" ry="32"/><ellipse cx="110" cy="90" rx="26" ry="18"/>
    <ellipse cx="110" cy="210" rx="46" ry="32"/><ellipse cx="110" cy="210" rx="26" ry="18"/>
