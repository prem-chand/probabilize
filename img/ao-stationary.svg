  <g fill="#f5a623"><circle cx="70" cy="150" r="5"/><circle cx="150" cy="150" r="5"/></g>
  <text x="240" y="94" fill="#16a36b" font-family="monospace" font-size="10">minima (H ≻ 0)</text>
  <text x="240" y="154" fill="#e5484d" font-family="monospace" font-size="10">maximum (H ≺ 0)</text>
  <text x="240" y="214" fill="#f5a623" font-family="monospace" font-size="10">saddles (H indefinite)</text>
  <text x="210" y="26" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="11">∇f = 0 is necessary but not sufficient — curvature decides</text>
