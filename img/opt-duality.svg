  <text x="186" y="238" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">feasible x ≥ 1</text>
  <line x1="245" y1="220" x2="420" y2="220" stroke="var(--border-default, #343a48)" stroke-width="1.2"/>
  <line x1="245" y1="220" x2="245" y2="45" stroke="var(--border-default, #343a48)" stroke-width="1.2"/>
  <path d="M245 220 Q290 186 325 172 Q360 186 415 220" stroke="#f5a623" stroke-width="2.5" fill="none"/>
  <g stroke="#16a36b" stroke-width="2.5">
    <line x1="318" y1="178" x2="328" y2="168"/><line x1="328" y1="178" x2="318" y2="168"/>
  </g>
  <text x="330" y="40" text-anchor="middle" fill="#f5a623" font-family="monospace" font-size="11">dual g(λ)=λ−½λ², λ≥0</text>
  <text x="334" y="160" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">λ* = 1</text>
  <line x1="100" y1="200" x2="415" y2="173" stroke="#16a36b" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.7"/>
  <text x="220" y="266" text-anchor="middle" fill="#16a36b" font-family="monospace" font-size="10">at the optimum f* = g(λ*): the duality gap is zero</text>
