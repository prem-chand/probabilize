<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" fill="none">
  <rect width="440" height="280" fill="var(--surface-sunken, #07090c)" rx="14"/>
  <line x1="220" y1="30" x2="220" y2="240" stroke="var(--border-subtle, #21262f)" stroke-width="1"/>
  <line x1="40" y1="220" x2="205" y2="220" stroke="var(--border-default, #343a48)" stroke-width="1.2"/>
