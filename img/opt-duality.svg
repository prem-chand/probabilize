  <path d="M100 200 Q130 175 160 140 Q180 118 195 100" stroke="#5879fb" stroke-width="2.5" fill="none"/>
  <g stroke="#16a36b" stroke-width="2.5">
    <line x1="95" y1="205" x2="105" y2="195"/><line x1="105" y1="205" x2="95" y2="195"/>
  </g>
  <text x="120" y="40" text-anchor="middle" fill="#5879fb" font-family="monospace" font-size="11">primal f(x)=½x², x≥1</text>
