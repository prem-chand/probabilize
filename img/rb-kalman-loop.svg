<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" fill="none">
  <rect width="440" height="250" fill="var(--surface-sunken, #07090c)" rx="14"/>
  <defs>
    <marker id="rbKfArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#9aa3b2"/></marker>
  </defs>
  <rect x="45" y="60" width="160" height="66" rx="8" fill="#5879fb" fill-opacity="0.2" stroke="#5879fb" stroke-width="1.6"/>
  <text x="125" y="88" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12">Predict</text>
  <text x="125" y="108" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">x̂⁻ = A x̂ + B u</text>
  <rect x="245" y="60" width="160" height="66" rx="8" fill="#f5a623" fill-opacity="0.18" stroke="#f5a623" stroke-width="1.6"/>
  <text x="325" y="88" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12">Update</text>
  <text x="325" y="108" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">x̂ = x̂⁻ + K(z − H x̂⁻)</text>
  <line x1="205" y1="93" x2="245" y2="93" stroke="#9aa3b2" stroke-width="2" marker-end="url(#rbKfArrow)"/>
  <text x="225" y="84" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="9">prior</text>
  <path d="M325 126 L325 170 L125 170 L125 126" stroke="#9aa3b2" stroke-width="2" fill="none" marker-end="url(#rbKfArrow)"/>
  <text x="225" y="186" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="9">posterior becomes next prior</text>
  <line x1="20" y1="93" x2="45" y2="93" stroke="#16a36b" stroke-width="2" marker-end="url(#rbKfArrow)"/>
  <text x="30" y="82" fill="#16a36b" font-family="monospace" font-size="10">u</text>
  <line x1="325" y1="24" x2="325" y2="60" stroke="#16a36b" stroke-width="2" marker-end="url(#rbKfArrow)"/>
  <text x="332" y="42" fill="#16a36b" font-family="monospace" font-size="10">z (measurement)</text>
  <text x="220" y="228" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">predict blends the motion model, update corrects with noisy sensors</text>
</svg>
