<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="300" viewBox="0 0 460 300">
<rect width="460" height="300" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(10 25)">
  
  <defs>
    <marker id="rbKfArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="var(--text-muted)"/></marker>
  </defs>
  <rect x="45" y="60" width="160" height="66" rx="8" fill="var(--figure-structure)" fill-opacity="0.2" stroke="var(--figure-structure)" stroke-width="1.5"/>
  <text x="125" y="88" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="12">Predict</text>
  <text x="125" y="108" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">x̂⁻ = A x̂ + B u</text>
  <rect x="245" y="60" width="160" height="66" rx="8" fill="var(--figure-accent)" fill-opacity="0.18" stroke="var(--figure-accent)" stroke-width="1.5"/>
  <text x="325" y="88" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="12">Update</text>
  <text x="325" y="108" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">x̂ = x̂⁻ + K(z − H x̂⁻)</text>
  <line x1="205" y1="93" x2="245" y2="93" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#rbKfArrow)"/>
  <text x="225" y="84" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">prior</text>
  <path d="M325 126 L325 170 L125 170 L125 126" stroke="var(--text-muted)" stroke-width="2" fill="none" marker-end="url(#rbKfArrow)"/>
  <text x="225" y="186" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">posterior becomes next prior</text>
  <line x1="20" y1="93" x2="45" y2="93" stroke="var(--figure-flow)" stroke-width="2" marker-end="url(#rbKfArrow)"/>
  <text x="30" y="82" fill="var(--figure-flow)" font-family="var(--font-mono)" font-size="10">u</text>
  <line x1="325" y1="24" x2="325" y2="60" stroke="var(--figure-flow)" stroke-width="2" marker-end="url(#rbKfArrow)"/>
  <text x="332" y="42" fill="var(--figure-flow)" font-family="var(--font-mono)" font-size="10">z (measurement)</text>
  <text x="220" y="228" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">predict blends the motion model, update corrects with noisy sensors</text>
</g>
</svg>