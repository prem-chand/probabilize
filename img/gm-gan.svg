  </defs>
  <circle cx="60" cy="90" r="22" fill="var(--figure-accent)" fill-opacity="0.2" stroke="var(--figure-accent)" stroke-width="1.5"/>
  <text x="60" y="94" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="11">z</text>
  <rect x="130" y="60" width="110" height="60" rx="8" fill="var(--figure-structure)" fill-opacity="0.2" stroke="var(--figure-structure)" stroke-width="1.5"/>
  <text x="185" y="88" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="10">generator G</text>
  <text x="185" y="105" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">fake samples</text>
  <rect x="320" y="60" width="126" height="60" rx="8" fill="var(--figure-flow)" fill-opacity="0.2" stroke="var(--figure-flow)" stroke-width="1.5"/>
  <text x="383" y="88" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="10">discriminator D</text>
