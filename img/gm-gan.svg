  <text x="383" y="178" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="10">real data x</text>
  <line x1="82" y1="90" x2="130" y2="90" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#gmGanArrow)"/>
  <line x1="240" y1="90" x2="320" y2="90" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#gmGanArrow)"/>
  <line x1="383" y1="150" x2="383" y2="120" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#gmGanArrow)"/>
  <path d="M360 60 C 300 30, 240 30, 195 58" stroke="var(--figure-alert)" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#gmGanArrow)"/>
