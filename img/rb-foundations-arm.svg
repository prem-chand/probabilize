<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="360" viewBox="0 0 460 360">
<rect width="460" height="360" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(10 10)">
  
  <text x="220" y="26" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="11">a 2-DOF planar arm: base, links, joints, end effector</text>
  <line x1="60" y1="292" x2="400" y2="292" stroke="var(--border-default)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="120" y="270" width="60" height="22" rx="4" fill="var(--border-default)"/>
  <text x="150" y="286" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="10">base</text>
  <line x1="150" y1="270" x2="257.2" y2="180" stroke="var(--figure-structure)" stroke-width="6" stroke-linecap="round"/>
  <line x1="257.2" y1="180" x2="276.3" y2="71.7" stroke="var(--figure-structure)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="150" cy="270" r="7" fill="var(--figure-accent)"/>
  <circle cx="257.2" cy="180" r="7" fill="var(--figure-accent)"/>
  <rect x="269.3" y="64.7" width="14" height="14" rx="2" fill="var(--figure-flow)"/>
  <path d="M270.5 64.7 L263 48 M282 64.7 L289.5 48" stroke="var(--figure-flow)" stroke-width="2" stroke-linecap="round"/>
  <path d="M190 270 A40 40 0 0 0 180.6 244.3" stroke="var(--figure-accent)" stroke-width="1.5" fill="none"/>
  <path d="M281.7 159.4 A32 32 0 0 0 262.8 148.5" stroke="var(--figure-accent)" stroke-width="1.5" fill="none"/>
  <text x="170" y="235" text-anchor="end" fill="var(--figure-accent)" font-family="var(--font-mono)" font-size="11">θ1</text>
  <text x="288" y="152" fill="var(--figure-accent)" font-family="var(--font-mono)" font-size="11">θ2</text>
  <text x="186" y="286" fill="var(--figure-accent)" font-family="var(--font-mono)" font-size="10">joint 1 (shoulder)</text>
