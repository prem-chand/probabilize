<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="240" viewBox="0 0 460 240">
<rect width="460" height="240" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(0 5)">
  
  <defs>
    <marker id="gmFlowArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="var(--figure-flow)"/></marker>
  </defs>
  <ellipse cx="70" cy="115" rx="34" ry="60" fill="var(--figure-structure)" fill-opacity="0.12" stroke="var(--figure-structure)" stroke-width="1.5"/>
  <text x="70" y="119" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="10">noise</text>
  <ellipse cx="392" cy="115" rx="34" ry="60" fill="var(--figure-flow)" fill-opacity="0.14" stroke="var(--figure-flow)" stroke-width="1.5"/>
  <text x="392" y="119" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="10">data</text>
  <g stroke="var(--figure-flow)" stroke-width="1.5">
    <line x1="108" y1="78" x2="354" y2="66" marker-end="url(#gmFlowArrow)"/>
    <line x1="108" y1="104" x2="354" y2="104" marker-end="url(#gmFlowArrow)"/>
    <line x1="108" y1="132" x2="354" y2="146" marker-end="url(#gmFlowArrow)"/>
    <line x1="108" y1="156" x2="354" y2="172" marker-end="url(#gmFlowArrow)"/>
  </g>
  <text x="230" y="30" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="11">flow matching: learn a velocity field from noise to data</text>
  <text x="230" y="200" text-anchor="middle" fill="var(--figure-flow)" font-family="var(--font-mono)" font-size="10">dx/dt = v_θ(x, t) — integrate the ODE from t=1 (noise) to t=0 (data)</text>
  <text x="230" y="215" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">straighter paths (rectified flow) mean fewer integration steps</text>
</g>
</svg>