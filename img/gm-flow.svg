<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 230" fill="none">
  <rect width="460" height="230" fill="var(--surface-sunken, #07090c)" rx="14"/>
  <defs>
    <marker id="gmFlowArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#16a36b"/></marker>
  </defs>
  <ellipse cx="70" cy="115" rx="34" ry="60" fill="#5879fb" fill-opacity="0.12" stroke="#5879fb" stroke-width="1.5"/>
  <text x="70" y="119" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10">noise</text>
  <ellipse cx="392" cy="115" rx="34" ry="60" fill="#16a36b" fill-opacity="0.14" stroke="#16a36b" stroke-width="1.5"/>
  <text x="392" y="119" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10">data</text>
  <g stroke="#16a36b" stroke-width="1.6">
    <line x1="108" y1="78" x2="354" y2="66" marker-end="url(#gmFlowArrow)"/>
    <line x1="108" y1="104" x2="354" y2="104" marker-end="url(#gmFlowArrow)"/>
    <line x1="108" y1="132" x2="354" y2="146" marker-end="url(#gmFlowArrow)"/>
    <line x1="108" y1="156" x2="354" y2="172" marker-end="url(#gmFlowArrow)"/>
  </g>
  <text x="230" y="30" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="11">flow matching: learn a velocity field from noise to data</text>
  <text x="230" y="200" text-anchor="middle" fill="#16a36b" font-family="monospace" font-size="10">dx/dt = v_θ(x, t) — integrate the ODE from t=1 (noise) to t=0 (data)</text>
  <text x="230" y="215" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">straighter paths (rectified flow) mean fewer integration steps</text>
</svg>
