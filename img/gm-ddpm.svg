<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" fill="none">
  <rect width="480" height="200" fill="var(--surface-sunken, #07090c)" rx="14"/>
  <defs>
    <marker id="gmDdpmFwd" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#e5484d"/></marker>
    <marker id="gmDdpmRev" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#16a36b"/></marker>
  </defs>
  <g font-family="monospace" font-size="10" fill="#ffffff" text-anchor="middle">
    <rect x="24" y="70" width="66" height="44" rx="6" fill="#5879fb" fill-opacity="0.22" stroke="#5879fb" stroke-width="1.3"/>
    <text x="57" y="96">x₀</text>
    <rect x="140" y="70" width="66" height="44" rx="6" fill="#5879fb" fill-opacity="0.14" stroke="#5879fb" stroke-width="1.3"/>
    <text x="173" y="96">x₁</text>
    <rect x="256" y="70" width="66" height="44" rx="6" fill="#e5484d" fill-opacity="0.12" stroke="#e5484d" stroke-width="1.3"/>
    <text x="289" y="96">…</text>
    <rect x="372" y="70" width="66" height="44" rx="6" fill="#e5484d" fill-opacity="0.2" stroke="#e5484d" stroke-width="1.3"/>
    <text x="405" y="96">x_T</text>
  </g>
  <g stroke="#e5484d" stroke-width="1.6">
    <line x1="90" y1="80" x2="140" y2="80" marker-end="url(#gmDdpmFwd)"/>
    <line x1="206" y1="80" x2="256" y2="80" marker-end="url(#gmDdpmFwd)"/>
    <line x1="322" y1="80" x2="372" y2="80" marker-end="url(#gmDdpmFwd)"/>
  </g>
  <g stroke="#16a36b" stroke-width="1.6">
    <line x1="372" y1="104" x2="322" y2="104" marker-end="url(#gmDdpmRev)"/>
    <line x1="256" y1="104" x2="206" y2="104" marker-end="url(#gmDdpmRev)"/>
    <line x1="140" y1="104" x2="90" y2="104" marker-end="url(#gmDdpmRev)"/>
  </g>
  <text x="230" y="42" text-anchor="middle" fill="#e5484d" font-family="monospace" font-size="10">forward q: add Gaussian noise over T steps</text>
  <text x="230" y="146" text-anchor="middle" fill="#16a36b" font-family="monospace" font-size="10">reverse p: learn to denoise, one step at a time</text>
  <text x="240" y="176" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">training target: predict the noise ε added at each step</text>
  <text x="240" y="24" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="11">DDPM: destroy data with noise, then learn to reverse the process</text>
</svg>
