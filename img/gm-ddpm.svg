<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="240" viewBox="0 0 460 240">
<rect width="460" height="240" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(0 24.17) scale(0.9583)">
  
  <defs>
    <marker id="gmDdpmFwd" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="var(--figure-alert)"/></marker>
    <marker id="gmDdpmRev" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="var(--figure-flow)"/></marker>
  </defs>
  <g font-family="var(--font-mono)" font-size="10" fill="var(--text-strong)" text-anchor="middle">
    <rect x="24" y="70" width="66" height="44" rx="6" fill="var(--figure-structure)" fill-opacity="0.22" stroke="var(--figure-structure)" stroke-width="1.5"/>
    <text x="57" y="96">x₀</text>
    <rect x="140" y="70" width="66" height="44" rx="6" fill="var(--figure-structure)" fill-opacity="0.14" stroke="var(--figure-structure)" stroke-width="1.5"/>
    <text x="173" y="96">x₁</text>
    <rect x="256" y="70" width="66" height="44" rx="6" fill="var(--figure-alert)" fill-opacity="0.12" stroke="var(--figure-alert)" stroke-width="1.5"/>
    <text x="289" y="96">…</text>
    <rect x="372" y="70" width="66" height="44" rx="6" fill="var(--figure-alert)" fill-opacity="0.2" stroke="var(--figure-alert)" stroke-width="1.5"/>
    <text x="405" y="96">x_T</text>
  </g>
  <g stroke="var(--figure-alert)" stroke-width="1.5">
    <line x1="90" y1="80" x2="140" y2="80" marker-end="url(#gmDdpmFwd)"/>
    <line x1="206" y1="80" x2="256" y2="80" marker-end="url(#gmDdpmFwd)"/>
    <line x1="322" y1="80" x2="372" y2="80" marker-end="url(#gmDdpmFwd)"/>
  </g>
  <g stroke="var(--figure-flow)" stroke-width="1.5">
    <line x1="372" y1="104" x2="322" y2="104" marker-end="url(#gmDdpmRev)"/>
    <line x1="256" y1="104" x2="206" y2="104" marker-end="url(#gmDdpmRev)"/>
    <line x1="140" y1="104" x2="90" y2="104" marker-end="url(#gmDdpmRev)"/>
  </g>
  <text x="230" y="42" text-anchor="middle" fill="var(--figure-alert)" font-family="var(--font-mono)" font-size="10">forward q: add Gaussian noise over T steps</text>
  <text x="230" y="146" text-anchor="middle" fill="var(--figure-flow)" font-family="var(--font-mono)" font-size="10">reverse p: learn to denoise, one step at a time</text>
  <text x="240" y="176" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">training target: predict the noise ε added at each step</text>
  <text x="240" y="24" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="11">DDPM: destroy data with noise, then learn to reverse the process</text>
</g>
</svg>