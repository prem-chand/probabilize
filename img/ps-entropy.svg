<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 210" fill="none">
  <rect width="460" height="210" fill="var(--surface-sunken, #07090c)" rx="14"/>
  <line x1="30" y1="150" x2="200" y2="150" stroke="var(--border-subtle, #21262f)" stroke-width="1.2"/>
  <g fill="#5879fb" fill-opacity="0.7">
    <rect x="42" y="64" width="20" height="86" rx="3"/><rect x="70" y="64" width="20" height="86" rx="3"/>
    <rect x="98" y="64" width="20" height="86" rx="3"/><rect x="126" y="64" width="20" height="86" rx="3"/>
  </g>
  <text x="105" y="168" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="9">uniform: high entropy</text>
  <line x1="250" y1="150" x2="420" y2="150" stroke="var(--border-subtle, #21262f)" stroke-width="1.2"/>
  <g fill="#16a36b" fill-opacity="0.7">
    <rect x="262" y="128" width="20" height="22" rx="3"/><rect x="290" y="58" width="20" height="92" rx="3"/>
    <rect x="318" y="128" width="20" height="22" rx="3"/><rect x="346" y="140" width="20" height="10" rx="3"/>
  </g>
  <text x="325" y="168" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="9">peaked: low entropy</text>
  <text x="230" y="26" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="11">entropy measures uncertainty; KL measures the cost of the wrong distribution</text>
  <text x="230" y="196" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">minimising KL(q‖p) is exactly maximising the likelihood — they are the same objective</text>
</svg>
