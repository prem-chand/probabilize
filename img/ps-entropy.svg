<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="240" viewBox="0 0 460 240">
<rect width="460" height="240" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(0 15)">
  
  <line x1="30" y1="150" x2="200" y2="150" stroke="var(--border-subtle)" stroke-width="1.5"/>
  <g fill="var(--figure-structure)" fill-opacity="0.7">
    <rect x="42" y="64" width="20" height="86" rx="3"/><rect x="70" y="64" width="20" height="86" rx="3"/>
    <rect x="98" y="64" width="20" height="86" rx="3"/><rect x="126" y="64" width="20" height="86" rx="3"/>
  </g>
  <text x="105" y="168" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">uniform: high entropy</text>
  <line x1="250" y1="150" x2="420" y2="150" stroke="var(--border-subtle)" stroke-width="1.5"/>
  <g fill="var(--figure-flow)" fill-opacity="0.7">
    <rect x="262" y="128" width="20" height="22" rx="3"/><rect x="290" y="58" width="20" height="92" rx="3"/>
    <rect x="318" y="128" width="20" height="22" rx="3"/><rect x="346" y="140" width="20" height="10" rx="3"/>
  </g>
  <text x="325" y="168" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">peaked: low entropy</text>
  <text x="230" y="26" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="11">entropy measures uncertainty; KL is the cost of being wrong</text>
  <text x="230" y="196" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">minimising KL(q‖p) is the same as maximising the likelihood</text>
</g>
</svg>