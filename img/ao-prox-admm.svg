<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" fill="none">
  <rect width="460" height="250" fill="var(--surface-sunken, #07090c)" rx="14"/>
  <defs>
    <marker id="aoAdmmArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#9aa3b2"/></marker>
  </defs>
  <rect x="30" y="60" width="120" height="60" rx="8" fill="#5879fb" fill-opacity="0.2" stroke="#5879fb" stroke-width="1.6"/>
  <text x="90" y="86" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">x-update</text>
  <text x="90" y="104" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="9">prox of f</text>
  <rect x="180" y="60" width="120" height="60" rx="8" fill="#f5a623" fill-opacity="0.18" stroke="#f5a623" stroke-width="1.6"/>
  <text x="240" y="86" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">z-update</text>
  <text x="240" y="104" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="9">prox of g</text>
  <rect x="330" y="60" width="110" height="60" rx="8" fill="#16a36b" fill-opacity="0.2" stroke="#16a36b" stroke-width="1.6"/>
  <text x="385" y="86" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">dual update</text>
  <text x="385" y="104" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="9">u += x − z</text>
  <g stroke="#9aa3b2" stroke-width="2">
    <line x1="150" y1="90" x2="180" y2="90" marker-end="url(#aoAdmmArrow)"/>
    <line x1="300" y1="90" x2="330" y2="90" marker-end="url(#aoAdmmArrow)"/>
  </g>
  <path d="M385 120 L385 178 L90 178 L90 120" stroke="#9aa3b2" stroke-width="2" fill="none" marker-end="url(#aoAdmmArrow)"/>
  <text x="237" y="196" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">repeat until consensus: x = z</text>
  <text x="230" y="30" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="11">ADMM splits a hard problem into two easy proximal steps plus a dual nudge</text>
  <text x="230" y="228" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">min f(x) + g(z) s.t. x = z</text>
</svg>
