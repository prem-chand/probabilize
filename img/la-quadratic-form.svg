<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="300" viewBox="0 0 460 300">
<rect width="460" height="300" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(10 20)">
  
  <line x1="220" y1="30" x2="220" y2="230" stroke="var(--border-subtle)" stroke-width="1.5"/>
  <text x="220" y="22" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="11">level sets of xᵀAx = 1</text>
  <g stroke="var(--border-subtle)" stroke-width="1.5">
    <line x1="40" y1="130" x2="180" y2="130"/>
    <line x1="110" y1="60" x2="110" y2="200"/>
    <line x1="260" y1="130" x2="400" y2="130"/>
    <line x1="330" y1="60" x2="330" y2="200"/>
  </g>
  <ellipse cx="110" cy="130" rx="70" ry="38" stroke="var(--figure-structure)" stroke-width="2"/>
  <path d="M290 62 C 232 92, 232 168, 290 198" stroke="var(--figure-accent)" stroke-width="2"/>
  <path d="M370 62 C 428 92, 428 168, 370 198" stroke="var(--figure-accent)" stroke-width="2"/>
  <text x="110" y="44" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">λ1, λ2 &gt; 0</text>
  <text x="110" y="248" text-anchor="middle" fill="var(--figure-structure)" font-family="var(--font-mono)" font-size="11">positive definite: ellipse</text>
  <text x="330" y="44" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">λ1 &gt; 0 &gt; λ2</text>
  <text x="330" y="248" text-anchor="middle" fill="var(--figure-accent)" font-family="var(--font-mono)" font-size="11">indefinite: hyperbola</text>
</g>
</svg>