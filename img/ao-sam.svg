<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="240" viewBox="0 0 460 240">
<rect width="460" height="240" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(5 0)">
  
  <line x1="30" y1="185" x2="420" y2="185" stroke="var(--border-default)" stroke-width="1.5"/>
  <path d="M60 185 L120 70 L180 185" stroke="var(--figure-alert)" stroke-width="2" fill="none"/>
  <path d="M240 185 C 275 130, 315 130, 350 185" stroke="var(--figure-flow)" stroke-width="2" fill="none"/>
  <circle cx="120" cy="66" r="10" fill="none" stroke="var(--figure-alert)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="295" cy="148" r="26" fill="none" stroke="var(--figure-flow)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="120" y="48" text-anchor="middle" fill="var(--figure-alert)" font-family="var(--font-mono)" font-size="10">sharp minimum</text>
  <text x="295" y="196" text-anchor="middle" fill="var(--figure-flow)" font-family="var(--font-mono)" font-size="10">flat minimum</text>
  <text x="225" y="30" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="11">sharpness-aware minimisation prefers wide basins</text>
  <text x="225" y="224" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">SAM minimises the worst loss nearby, not the loss at one point</text>
