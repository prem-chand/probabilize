<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" fill="none">
  <rect width="480" height="230" fill="var(--surface-sunken, #07090c)" rx="14"/>
  <defs>
    <marker id="laSvdBrand" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#5879fb"/></marker>
  </defs>
  <text x="240" y="26" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="11">A = U Σ Vᵀ is rotate, then stretch, then rotate</text>
  <g stroke="var(--border-subtle, #21262f)" stroke-width="1">
    <line x1="48" y1="110" x2="96" y2="110"/>
    <line x1="72" y1="86" x2="72" y2="134"/>
  </g>
  <circle cx="72" cy="110" r="42" stroke="#5879fb" stroke-width="2"/>
  <text x="72" y="170" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">x</text>
  <text x="72" y="188" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">unit circle</text>
  <line x1="126" y1="110" x2="166" y2="110" stroke="#5879fb" stroke-width="2" marker-end="url(#laSvdBrand)"/>
  <text x="146" y="100" text-anchor="middle" fill="#5879fb" font-family="monospace" font-size="11">Vᵀ</text>
  <ellipse cx="230" cy="110" rx="52" ry="24" stroke="#5879fb" stroke-width="2"/>
  <text x="230" y="170" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">Σ</text>
  <text x="230" y="188" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">axis-aligned stretch</text>
  <line x1="286" y1="110" x2="326" y2="110" stroke="#5879fb" stroke-width="2" marker-end="url(#laSvdBrand)"/>
  <text x="306" y="100" text-anchor="middle" fill="#5879fb" font-family="monospace" font-size="11">U</text>
  <ellipse cx="400" cy="110" rx="52" ry="24" transform="rotate(-30 400 110)" stroke="#5879fb" stroke-width="2"/>
  <text x="400" y="170" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">Ax</text>
  <text x="400" y="188" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">ellipse</text>
