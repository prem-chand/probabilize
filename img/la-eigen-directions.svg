<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" fill="none" role="img" aria-labelledby="laEigenTitle laEigenDesc">
  <title id="laEigenTitle">Eigen-directions under one matrix</title>
  <desc id="laEigenDesc">The matrix A maps a generic vector x to a non-parallel vector Ax, while eigenvectors v and w stay on their lines: v maps to 3v and w maps to w.</desc>

  <rect width="640" height="320" fill="var(--surface-sunken, #07090c)" rx="14"/>
  <defs>
    <marker id="laEigGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#16a36b"/></marker>
    <marker id="laEigBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#5879fb"/></marker>
    <marker id="laEigAmber" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#f5a623"/></marker>
  </defs>

  <!-- One explicit matrix establishes the shared context for both examples. -->
  <rect x="16" y="14" width="608" height="42" rx="10" fill="var(--surface-raised, #10141b)" stroke="var(--border-subtle, #21262f)"/>
  <text x="32" y="40" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="11.5">same matrix</text>
  <text x="138" y="40" fill="var(--text-primary, #f8fafc)" font-family="monospace" font-size="13">A = [[2,1],[1,2]]</text>
  <text x="608" y="40" text-anchor="end" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="11.5">for every arrow</text>

  <line x1="312" y1="76" x2="312" y2="304" stroke="var(--border-subtle, #21262f)" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Generic vector: x and Ax leave the same origin at different angles. -->
  <text x="160" y="84" text-anchor="middle" fill="var(--text-primary, #f8fafc)" font-family="monospace" font-size="12">generic vector</text>
  <text x="160" y="100" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="11">x → Ax</text>
  <line x1="34" y1="230" x2="294" y2="230" stroke="var(--border-default, #343a48)" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="58" y1="110" x2="58" y2="264" stroke="var(--border-default, #343a48)" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M92 213 A38 38 0 0 1 88 195" stroke="#16a36b" stroke-width="1.4" fill="none"/>
  <line x1="58" y1="230" x2="126" y2="196" stroke="#16a36b" stroke-width="2.5" marker-end="url(#laEigGreen)"/>
  <line x1="58" y1="230" x2="218" y2="102" stroke="#16a36b" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#laEigGreen)"/>
  <circle cx="58" cy="230" r="4" fill="var(--text-primary, #f8fafc)"/>
  <text x="132" y="193" fill="#16a36b" font-family="monospace" font-size="12">x</text>
  <text x="224" y="108" fill="#16a36b" font-family="monospace" font-size="12">Ax</text>
  <text x="160" y="286" text-anchor="middle" fill="#16a36b" font-family="monospace" font-size="11">direction changes · not parallel</text>

  <!-- Eigen-directions: both vectors remain on invariant lines. -->
  <text x="468" y="84" text-anchor="middle" fill="var(--text-primary, #f8fafc)" font-family="monospace" font-size="12">eigen-directions</text>
  <text x="468" y="100" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="11">vectors stay on their lines</text>
  <line x1="350" y1="210" x2="602" y2="210" stroke="var(--border-default, #343a48)" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="472" y1="112" x2="472" y2="288" stroke="var(--border-default, #343a48)" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="392" y1="290" x2="552" y2="130" stroke="#5879fb" stroke-width="1.6" opacity="0.45"/>
  <line x1="392" y1="130" x2="552" y2="290" stroke="#f5a623" stroke-width="1.6" opacity="0.45"/>
  <line x1="472" y1="210" x2="516" y2="166" stroke="#5879fb" stroke-width="2.5" marker-end="url(#laEigBlue)"/>
  <line x1="472" y1="210" x2="572" y2="110" stroke="#5879fb" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#laEigBlue)"/>
  <line x1="472" y1="210" x2="516" y2="254" stroke="#f5a623" stroke-width="2.5" marker-end="url(#laEigAmber)"/>
  <circle cx="472" cy="210" r="4" fill="var(--text-primary, #f8fafc)"/>
  <text x="521" y="160" fill="#5879fb" font-family="monospace" font-size="12">v</text>
  <text x="579" y="108" fill="#5879fb" font-family="monospace" font-size="12">3v</text>
  <text x="521" y="267" fill="#f5a623" font-family="monospace" font-size="12">w</text>
  <text x="344" y="278" fill="#5879fb" font-family="monospace" font-size="11">v → 3v  (λ = 3)</text>
  <text x="344" y="300" fill="#f5a623" font-family="monospace" font-size="11">w → w    (λ = 1)</text>
</svg>
