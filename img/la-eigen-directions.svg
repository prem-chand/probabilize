<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" fill="none">
  <rect width="540" height="300" fill="var(--surface-sunken, #07090c)" rx="14"/>
  <defs>
    <marker id="laEigGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#16a36b"/></marker>
    <marker id="laEigBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#5879fb"/></marker>
  </defs>

  <line x1="270" y1="30" x2="270" y2="262" stroke="var(--border-subtle, #21262f)" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- left: a generic vector gets rotated -->
  <text x="132" y="38" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="11">generic x — A rotates it</text>
  <line x1="22" y1="190" x2="252" y2="190" stroke="var(--border-default, #343a48)" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M124 190 A44 44 0 0 0 119.4 170.3" stroke="#16a36b" stroke-width="1.4" fill="none"/>
  <line x1="80" y1="190" x2="135" y2="190" stroke="#16a36b" stroke-width="2.5" marker-end="url(#laEigGreen)"/>
  <line x1="80" y1="190" x2="190" y2="135" stroke="#16a36b" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#laEigGreen)"/>
  <circle cx="80" cy="190" r="4" fill="#ffffff"/>
  <text x="139" y="184" fill="#16a36b" font-family="monospace" font-size="11">x</text>
  <text x="198" y="130" fill="#16a36b" font-family="monospace" font-size="11">Ax</text>
  <text x="132" y="242" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="9">Ax is not parallel to x</text>

  <!-- right: a vector along an eigen-line is only stretched -->
  <text x="405" y="38" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="11">eigenvector v — only stretched</text>
  <line x1="277" y1="253" x2="440" y2="90" stroke="#5879fb" stroke-width="1.6" opacity="0.45"/>
  <line x1="277" y1="147" x2="387" y2="257" stroke="#f5a623" stroke-width="1.6" opacity="0.45"/>
  <line x1="330" y1="200" x2="362" y2="168" stroke="#5879fb" stroke-width="2.5" marker-end="url(#laEigBlue)"/>
  <line x1="330" y1="200" x2="426" y2="104" stroke="#5879fb" stroke-width="2.5" marker-end="url(#laEigBlue)"/>
  <circle cx="330" cy="200" r="4" fill="#ffffff"/>
  <text x="372" y="178" fill="#5879fb" font-family="monospace" font-size="11">v</text>
  <text x="432" y="109" fill="#5879fb" font-family="monospace" font-size="11">Av = 3v</text>
  <text x="401" y="243" text-anchor="middle" fill="#f5a623" font-family="monospace" font-size="10">λ = 1</text>
</svg>
