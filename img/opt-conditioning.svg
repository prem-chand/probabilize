<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="300" viewBox="0 0 460 300">
<rect width="460" height="300" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(10 20)">
  
  <line x1="220" y1="26" x2="220" y2="234" stroke="var(--border-subtle)" stroke-width="1.5"/>
  <g stroke="var(--border-subtle)" stroke-width="1.5">
    <circle cx="110" cy="130" r="72"/>
    <circle cx="110" cy="130" r="50"/>
    <circle cx="110" cy="130" r="28"/>
    <circle cx="110" cy="130" r="10"/>
  </g>
  <polyline points="182,130 160,130 138,130 120,130 110,130" stroke="var(--figure-flow)" stroke-width="2" fill="none"/>
  <g fill="var(--figure-flow)"><circle cx="182" cy="130" r="3.5"/><circle cx="138" cy="130" r="3.5"/><circle cx="110" cy="130" r="3.5"/></g>
  <text x="110" y="42" text-anchor="middle" fill="var(--figure-flow)" font-family="var(--font-mono)" font-size="11">κ ≈ 1 (spherical)</text>
  <text x="110" y="222" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">direct, fast</text>
  <g stroke="var(--border-subtle)" stroke-width="1.5">
    <ellipse cx="330" cy="130" rx="85" ry="30"/>
    <ellipse cx="330" cy="130" rx="62" ry="21"/>
    <ellipse cx="330" cy="130" rx="38" ry="13"/>
    <ellipse cx="330" cy="130" rx="14" ry="6"/>
  </g>
  <polyline points="415,130 388,100 366,158 352,112 344,146 338,120 334,138 332,130" stroke="var(--figure-alert)" stroke-width="2" fill="none"/>
  <g fill="var(--figure-alert)"><circle cx="415" cy="130" r="3.5"/><circle cx="366" cy="158" r="3.5"/><circle cx="344" cy="146" r="3.5"/><circle cx="332" cy="130" r="3.5"/></g>
  <text x="330" y="42" text-anchor="middle" fill="var(--figure-alert)" font-family="var(--font-mono)" font-size="11">κ = 100 (valley)</text>
  <text x="330" y="222" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">zigzag, slow</text>
  <text x="220" y="248" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">the condition number κ = L/μ sets how many iterations GD needs</text>
