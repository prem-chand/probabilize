<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="300" viewBox="0 0 460 300">
<rect width="460" height="300" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(0 10)">
  
  <defs>
    <marker id="rlPomBrand" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="var(--figure-structure)"/></marker>
    <marker id="rlPomAmber" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="var(--figure-accent)"/></marker>
    <marker id="rlPomGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="var(--figure-flow)"/></marker>
  </defs>
  <rect x="155" y="40" width="170" height="62" rx="8" fill="var(--figure-flow)" fill-opacity="0.2" stroke="var(--figure-flow)" stroke-width="1.5"/>
  <text x="240" y="68" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="12">hidden state s_t</text>
  <text x="240" y="86" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">Markov, unobserved</text>
  <rect x="20" y="165" width="150" height="62" rx="8" fill="var(--figure-structure)" fill-opacity="0.2" stroke="var(--figure-structure)" stroke-width="1.5"/>
  <text x="95" y="192" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="12">agent / policy</text>
  <text x="95" y="210" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">acts on belief b(s)</text>
  <rect x="300" y="165" width="140" height="62" rx="8" fill="var(--figure-accent)" fill-opacity="0.18" stroke="var(--figure-accent)" stroke-width="1.5"/>
  <text x="370" y="192" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="12">observation o_t</text>
  <text x="370" y="210" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">lossy / noisy</text>
  <line x1="112" y1="165" x2="190" y2="102" stroke="var(--figure-structure)" stroke-width="2" marker-end="url(#rlPomBrand)"/>
  <text x="150" y="128" fill="var(--figure-structure)" font-family="var(--font-mono)" font-size="10">action a_t</text>
  <line x1="290" y1="102" x2="358" y2="165" stroke="var(--figure-flow)" stroke-width="2" marker-end="url(#rlPomGreen)"/>
  <text x="345" y="126" fill="var(--figure-flow)" font-family="var(--font-mono)" font-size="10">O(o|s)</text>
  <line x1="300" y1="196" x2="170" y2="196" stroke="var(--figure-accent)" stroke-width="2" marker-end="url(#rlPomAmber)"/>
  <text x="235" y="188" text-anchor="middle" fill="var(--figure-accent)" font-family="var(--font-mono)" font-size="10">observes o_t, updates belief</text>
  <text x="230" y="26" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="11">POMDP: the agent never sees the hidden state, only a lossy signal</text>
  <text x="230" y="258" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">treating observations as states breaks the Markov assumption</text>
</g>
</svg>