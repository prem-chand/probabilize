<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" fill="none">
  <rect width="460" height="280" fill="var(--surface-sunken, #07090c)" rx="14"/>
  <defs>
    <marker id="rlPomBrand" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#5879fb"/></marker>
    <marker id="rlPomAmber" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#f5a623"/></marker>
    <marker id="rlPomGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#16a36b"/></marker>
  </defs>
  <rect x="155" y="40" width="170" height="62" rx="8" fill="#16a36b" fill-opacity="0.2" stroke="#16a36b" stroke-width="1.6"/>
  <text x="240" y="68" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12">hidden state s_t</text>
  <text x="240" y="86" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">Markov, unobserved</text>
  <rect x="20" y="165" width="150" height="62" rx="8" fill="#5879fb" fill-opacity="0.2" stroke="#5879fb" stroke-width="1.6"/>
  <text x="95" y="192" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12">agent / policy</text>
  <text x="95" y="210" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">acts on belief b(s)</text>
  <rect x="300" y="165" width="140" height="62" rx="8" fill="#f5a623" fill-opacity="0.18" stroke="#f5a623" stroke-width="1.6"/>
  <text x="370" y="192" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12">observation o_t</text>
  <text x="370" y="210" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">lossy / noisy</text>
  <line x1="112" y1="165" x2="190" y2="102" stroke="#5879fb" stroke-width="2" marker-end="url(#rlPomBrand)"/>
  <text x="150" y="128" fill="#5879fb" font-family="monospace" font-size="10">action a_t</text>
  <line x1="290" y1="102" x2="358" y2="165" stroke="#16a36b" stroke-width="2" marker-end="url(#rlPomGreen)"/>
  <text x="345" y="126" fill="#16a36b" font-family="monospace" font-size="10">O(o|s)</text>
  <line x1="300" y1="196" x2="170" y2="196" stroke="#f5a623" stroke-width="2" marker-end="url(#rlPomAmber)"/>
  <text x="235" y="188" text-anchor="middle" fill="#f5a623" font-family="monospace" font-size="10">observes o_t, updates belief</text>
  <text x="230" y="26" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="11">POMDP: the agent never sees the hidden state, only a lossy signal</text>
  <text x="230" y="258" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">treating observations as states breaks the Markov assumption</text>
</svg>
