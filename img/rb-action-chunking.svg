<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 210" fill="none">
  <rect width="460" height="210" fill="var(--surface-sunken, #07090c)" rx="14"/>
  <line x1="30" y1="150" x2="440" y2="150" stroke="var(--border-default, #343a48)" stroke-width="1.4"/>
  <g fill="#5879fb" fill-opacity="0.35" stroke="#5879fb" stroke-width="1">
    <rect x="45" y="119" width="26" height="22" rx="3"/><rect x="75" y="119" width="26" height="22" rx="3"/>
    <rect x="105" y="119" width="26" height="22" rx="3"/><rect x="135" y="119" width="26" height="22" rx="3"/>
    <rect x="165" y="119" width="26" height="22" rx="3"/><rect x="195" y="119" width="26" height="22" rx="3"/>
  </g>
  <g fill="#f5a623" fill-opacity="0.32" stroke="#f5a623" stroke-width="1">
    <rect x="245" y="119" width="26" height="22" rx="3"/><rect x="275" y="119" width="26" height="22" rx="3"/>
    <rect x="305" y="119" width="26" height="22" rx="3"/><rect x="335" y="119" width="26" height="22" rx="3"/>
    <rect x="365" y="119" width="26" height="22" rx="3"/><rect x="395" y="119" width="26" height="22" rx="3"/>
  </g>
  <line x1="232" y1="60" x2="232" y2="180" stroke="var(--border-subtle, #21262f)" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="232" y="196" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">re-plan</text>
  <text x="133" y="110" text-anchor="middle" fill="#5879fb" font-family="monospace" font-size="10">chunk 1: H actions from o_t</text>
  <text x="333" y="110" text-anchor="middle" fill="#f5a623" font-family="monospace" font-size="10">chunk 2: re-planned from o_t+H</text>
  <text x="232" y="80" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">executed open-loop, no per-step inference</text>
  <text x="230" y="26" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="11">action chunking: one forward pass predicts a horizon of actions</text>
  <text x="230" y="44" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">fewer decisions per trajectory — so fewer places for error to compound</text>
</svg>
