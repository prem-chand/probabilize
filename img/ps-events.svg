<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 230" fill="none">
  <rect width="440" height="230" fill="var(--surface-sunken, #07090c)" rx="14"/>
  <rect x="40" y="46" width="220" height="150" rx="8" fill="none" stroke="var(--border-default, #343a48)" stroke-width="1.5"/>
  <text x="52" y="66" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">Ω</text>
  <circle cx="130" cy="120" r="52" fill="#5879fb" fill-opacity="0.18" stroke="#5879fb" stroke-width="1.5"/>
  <circle cx="185" cy="120" r="52" fill="#f5a623" fill-opacity="0.16" stroke="#f5a623" stroke-width="1.5"/>
  <text x="98" y="112" fill="#5879fb" font-family="monospace" font-size="11">A</text>
  <text x="212" y="112" fill="#f5a623" font-family="monospace" font-size="11">B</text>
  <text x="157" y="126" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="9">A∩B</text>
  <text x="320" y="88" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">P(A∪B) = P(A)+P(B)−P(A∩B)</text>
  <text x="320" y="112" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">disjoint: P(A∩B) = 0</text>
  <text x="320" y="136" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">complement: P(Aᶜ) = 1 − P(A)</text>
  <text x="220" y="26" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="11">events are sets; probability is a measure on them</text>
  <text x="220" y="216" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">Kolmogorov's three axioms generate every rule below</text>
</svg>
