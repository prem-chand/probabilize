<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="240" viewBox="0 0 460 240">
<rect width="460" height="240" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(10 5)">
  
  <rect x="40" y="46" width="220" height="150" rx="8" fill="none" stroke="var(--border-default)" stroke-width="1.5"/>
  <text x="52" y="66" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">Ω</text>
  <circle cx="130" cy="120" r="52" fill="var(--figure-structure)" fill-opacity="0.18" stroke="var(--figure-structure)" stroke-width="1.5"/>
  <circle cx="185" cy="120" r="52" fill="var(--figure-accent)" fill-opacity="0.16" stroke="var(--figure-accent)" stroke-width="1.5"/>
  <text x="98" y="112" fill="var(--figure-structure)" font-family="var(--font-mono)" font-size="11">A</text>
  <text x="212" y="112" fill="var(--figure-accent)" font-family="var(--font-mono)" font-size="11">B</text>
  <text x="157" y="126" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="10">A∩B</text>
  <text x="266" y="88" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">P(A∪B) = P(A)+P(B)−P(A∩B)</text>
  <text x="266" y="112" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">disjoint: P(A∩B) = 0</text>
  <text x="266" y="136" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">complement: P(Aᶜ) = 1 − P(A)</text>
  <text x="220" y="26" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="11">events are sets; probability is a measure on them</text>
  <text x="220" y="216" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">Kolmogorov's three axioms generate every rule below</text>
</g>
</svg>