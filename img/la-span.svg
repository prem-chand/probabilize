<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="300" viewBox="0 0 460 300">
<rect width="460" height="300" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(20 0)">
  
  <defs>
    <marker id="laSpanBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="var(--figure-structure)"/></marker>
    <marker id="laSpanAmber" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="var(--figure-accent)"/></marker>
    <marker id="laSpanGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="var(--figure-flow)"/></marker>
  </defs>
  <g stroke="var(--border-subtle)" stroke-width="1.5" opacity="0.5">
    <path d="M40 20V280 M120 20V280 M160 20V280 M200 20V280 M240 20V280 M280 20V280 M320 20V280 M360 20V280 M400 20V280"/>
    <path d="M40 40H400 M40 80H400 M40 120H400 M40 160H400 M40 200H400 M40 280H400"/>
  </g>
  <g stroke="var(--border-default)" stroke-width="1.5">
    <line x1="40" y1="240" x2="400" y2="240"/>
    <line x1="80" y1="290" x2="80" y2="20"/>
  </g>
  <line x1="80" y1="240" x2="120" y2="200" stroke="var(--figure-structure)" stroke-width="2" marker-end="url(#laSpanBlue)"/>
  <line x1="80" y1="240" x2="120" y2="280" stroke="var(--figure-accent)" stroke-width="2" marker-end="url(#laSpanAmber)"/>
  <g stroke-width="2" stroke-dasharray="6 4" opacity="0.85">
    <line x1="80" y1="240" x2="200" y2="120" stroke="var(--figure-structure)" marker-end="url(#laSpanBlue)"/>
    <line x1="120" y1="280" x2="240" y2="160" stroke="var(--figure-structure)"/>
    <line x1="200" y1="120" x2="240" y2="160" stroke="var(--figure-accent)"/>
    <line x1="120" y1="280" x2="240" y2="160" stroke="var(--figure-accent)"/>
  </g>
  <line x1="80" y1="240" x2="240" y2="160" stroke="var(--figure-flow)" stroke-width="2" marker-end="url(#laSpanGreen)"/>
  <text x="210" y="26" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="11">span{v1, v2} is the whole plane</text>
  <text x="128" y="198" fill="var(--figure-structure)" font-family="var(--font-mono)" font-size="12">v1</text>
  <text x="126" y="285" fill="var(--figure-accent)" font-family="var(--font-mono)" font-size="12">v2</text>
  <text x="150" y="116" fill="var(--figure-structure)" font-family="var(--font-mono)" font-size="12">3v1</text>
  <text x="246" y="156" fill="var(--figure-flow)" font-family="var(--font-mono)" font-size="12">b = 3v1 + v2</text>
</g>
</svg>