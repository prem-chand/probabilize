<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" fill="none">
  <rect width="420" height="300" fill="var(--surface-sunken, #07090c)" rx="14"/>
  <defs>
    <marker id="laSpanBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#5879fb"/></marker>
    <marker id="laSpanAmber" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#f5a623"/></marker>
    <marker id="laSpanGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#16a36b"/></marker>
  </defs>
  <g stroke="var(--border-subtle, #21262f)" stroke-width="1" opacity="0.5">
    <path d="M40 20V280 M120 20V280 M160 20V280 M200 20V280 M240 20V280 M280 20V280 M320 20V280 M360 20V280 M400 20V280"/>
    <path d="M40 40H400 M40 80H400 M40 120H400 M40 160H400 M40 200H400 M40 280H400"/>
  </g>
  <g stroke="var(--border-default, #343a48)" stroke-width="1.5">
    <line x1="40" y1="240" x2="400" y2="240"/>
    <line x1="80" y1="290" x2="80" y2="20"/>
  </g>
  <line x1="80" y1="240" x2="120" y2="200" stroke="#5879fb" stroke-width="2.5" marker-end="url(#laSpanBlue)"/>
  <line x1="80" y1="240" x2="120" y2="280" stroke="#f5a623" stroke-width="2.5" marker-end="url(#laSpanAmber)"/>
  <g stroke-width="2" stroke-dasharray="6 4" opacity="0.85">
    <line x1="80" y1="240" x2="200" y2="120" stroke="#5879fb" marker-end="url(#laSpanBlue)"/>
    <line x1="120" y1="280" x2="240" y2="160" stroke="#5879fb"/>
    <line x1="200" y1="120" x2="240" y2="160" stroke="#f5a623"/>
    <line x1="120" y1="280" x2="240" y2="160" stroke="#f5a623"/>
  </g>
  <line x1="80" y1="240" x2="240" y2="160" stroke="#16a36b" stroke-width="3" marker-end="url(#laSpanGreen)"/>
  <text x="210" y="26" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="11">span{v1, v2} is the whole plane</text>
  <text x="128" y="198" fill="#5879fb" font-family="monospace" font-size="12">v1</text>
  <text x="126" y="285" fill="#f5a623" font-family="monospace" font-size="12">v2</text>
  <text x="150" y="116" fill="#5879fb" font-family="monospace" font-size="12">3v1</text>
  <text x="246" y="156" fill="#16a36b" font-family="monospace" font-size="12">b = 3v1 + v2</text>
</svg>
