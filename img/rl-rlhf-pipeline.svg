<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="240" viewBox="0 0 460 240">
<rect width="460" height="240" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(0 5) scale(0.9583)">
  
  <defs>
    <marker id="rlRlhfArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="var(--text-muted)"/></marker>
    <marker id="rlRlhfKl" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="var(--figure-alert)"/></marker>
  </defs>
  <rect x="20" y="64" width="130" height="76" rx="8" fill="var(--figure-structure)" fill-opacity="0.2" stroke="var(--figure-structure)" stroke-width="1.5"/>
  <text x="85" y="92" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="11">1. SFT</text>
  <text x="85" y="110" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">fine-tune base model</text>
  <text x="85" y="126" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">π_SFT = π_ref</text>
  <rect x="175" y="64" width="130" height="76" rx="8" fill="var(--figure-accent)" fill-opacity="0.18" stroke="var(--figure-accent)" stroke-width="1.5"/>
  <text x="240" y="92" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="11">2. Reward model</text>
  <text x="240" y="110" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">pairwise preferences</text>
  <text x="240" y="126" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">r_φ(x, y)</text>
  <rect x="330" y="64" width="130" height="76" rx="8" fill="var(--figure-flow)" fill-opacity="0.2" stroke="var(--figure-flow)" stroke-width="1.5"/>
  <text x="395" y="92" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="11">3. PPO</text>
  <text x="395" y="110" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">maximize r_φ</text>
  <text x="395" y="126" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">− β·KL penalty</text>
  <line x1="150" y1="102" x2="175" y2="102" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#rlRlhfArrow)"/>
  <line x1="305" y1="102" x2="330" y2="102" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#rlRlhfArrow)"/>
  <path d="M395 140 L395 190 L85 190 L85 140" stroke="var(--figure-alert)" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#rlRlhfKl)"/>
  <text x="240" y="206" text-anchor="middle" fill="var(--figure-alert)" font-family="var(--font-mono)" font-size="10">KL(π_θ ‖ π_ref) keeps the policy near the SFT model</text>
  <text x="240" y="30" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="11">RLHF in three stages: format → learn → optimize under a leash</text>
</g>
</svg>