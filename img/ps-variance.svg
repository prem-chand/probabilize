<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="240" viewBox="0 0 460 240">
<rect width="460" height="240" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(5 15)">
  
  <line x1="40" y1="160" x2="410" y2="160" stroke="var(--border-default)" stroke-width="1.5"/>
  <line x1="225" y1="180" x2="225" y2="40" stroke="var(--border-subtle)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M120 160 C 180 160, 190 74, 225 74 C 260 74, 270 160, 330 160" stroke="var(--figure-structure)" stroke-width="2" fill="none"/>
  <path d="M170 160 C 205 160, 212 116, 225 116 C 238 116, 245 160, 280 160" stroke="var(--figure-flow)" stroke-width="2" fill="none"/>
  <text x="225" y="196" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">both centred at μ — spread is the difference</text>
  <text x="300" y="86" fill="var(--figure-structure)" font-family="var(--font-mono)" font-size="10">high variance</text>
  <text x="262" y="128" fill="var(--figure-flow)" font-family="var(--font-mono)" font-size="10">low variance</text>
  <text x="225" y="26" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="11">expectation locates; variance and covariance describe spread</text>
  <text x="225" y="42" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">Var(X) = E[(X − μ)²] · Cov(X,Y) measures joint movement</text>
</g>
</svg>