<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 210" fill="none">
  <rect width="450" height="210" fill="var(--surface-sunken, #07090c)" rx="14"/>
  <line x1="40" y1="160" x2="410" y2="160" stroke="var(--border-default, #343a48)" stroke-width="1.4"/>
  <line x1="225" y1="180" x2="225" y2="40" stroke="var(--border-subtle, #21262f)" stroke-width="1.2" stroke-dasharray="4 4"/>
  <path d="M120 160 C 180 160, 190 74, 225 74 C 260 74, 270 160, 330 160" stroke="#5879fb" stroke-width="2" fill="none"/>
  <path d="M170 160 C 205 160, 212 116, 225 116 C 238 116, 245 160, 280 160" stroke="#16a36b" stroke-width="2" fill="none"/>
  <text x="225" y="196" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">both centred at μ — spread is the difference</text>
  <text x="300" y="86" fill="#5879fb" font-family="monospace" font-size="10">high variance</text>
  <text x="262" y="128" fill="#16a36b" font-family="monospace" font-size="10">low variance</text>
  <text x="225" y="26" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="11">expectation locates; variance and covariance describe spread</text>
  <text x="225" y="42" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="9">Var(X) = E[(X − μ)²] · Cov(X,Y) measures joint movement</text>
</svg>
