    <marker id="laTransAmber" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#f5a623"/></marker>
  </defs>
  <line x1="60" y1="200" x2="370" y2="200" stroke="var(--border-default, #343a48)" stroke-width="1.5"/>
