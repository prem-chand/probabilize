<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="300" viewBox="0 0 460 300">
<rect width="460" height="300" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(20 20)">
  
  <defs>
    <marker id="laTransBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="var(--figure-structure)"/></marker>
    <marker id="laTransAmber" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="var(--figure-accent)"/></marker>
  </defs>
  <line x1="60" y1="200" x2="370" y2="200" stroke="var(--border-default)" stroke-width="1.5"/>
  <line x1="100" y1="245" x2="100" y2="20" stroke="var(--border-default)" stroke-width="1.5"/>
  <polygon points="100,200 170,200 170,130 100,130" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="100,200 170,200 240,130 170,130" fill="var(--figure-structure)" fill-opacity="0.16" stroke="var(--figure-structure)" stroke-width="2"/>
  <line x1="100" y1="200" x2="170" y2="200" stroke="var(--figure-structure)" stroke-width="2" marker-end="url(#laTransBlue)"/>
  <line x1="100" y1="200" x2="170" y2="130" stroke="var(--figure-accent)" stroke-width="2" marker-end="url(#laTransAmber)"/>
  <text x="210" y="26" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="11">A = [[1,1],[0,1]] shears the unit square</text>
  <text x="176" y="196" fill="var(--figure-structure)" font-family="var(--font-mono)" font-size="12">a1 = (1,0)</text>
  <text x="180" y="124" fill="var(--figure-accent)" font-family="var(--font-mono)" font-size="12">a2 = (1,1)</text>
  <text x="40" y="146" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">original</text>
</g>
</svg>