<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" fill="none">
  <rect width="460" height="300" fill="var(--surface-sunken, #07090c)" rx="14"/>
  <defs>
    <marker id="rlMbArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#9aa3b2"/></marker>
  </defs>
  <rect x="30" y="120" width="140" height="64" rx="8" fill="#16a36b" fill-opacity="0.2" stroke="#16a36b" stroke-width="1.6"/>
  <text x="100" y="148" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12">real env</text>
  <text x="100" y="166" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">1 real step</text>
  <rect x="290" y="120" width="140" height="64" rx="8" fill="#5879fb" fill-opacity="0.2" stroke="#5879fb" stroke-width="1.6"/>
  <text x="360" y="148" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12">learned model</text>
  <text x="360" y="166" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">P̂, R̂</text>
  <rect x="155" y="34" width="150" height="56" rx="8" fill="#f5a623" fill-opacity="0.18" stroke="#f5a623" stroke-width="1.6"/>
  <text x="230" y="58" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12">imagined rollouts</text>
  <text x="230" y="76" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">k samples</text>
  <rect x="160" y="222" width="140" height="56" rx="8" fill="#5879fb" fill-opacity="0.2" stroke="#5879fb" stroke-width="1.6"/>
  <text x="230" y="246" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12">value update Q</text>
  <text x="230" y="264" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">real + imagined</text>
  <line x1="170" y1="145" x2="290" y2="145" stroke="#9aa3b2" stroke-width="2" marker-end="url(#rlMbArrow)"/>
  <text x="230" y="137" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">update model</text>
  <line x1="340" y1="120" x2="285" y2="90" stroke="#9aa3b2" stroke-width="2" marker-end="url(#rlMbArrow)"/>
  <text x="345" y="98" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">query</text>
  <line x1="230" y1="90" x2="230" y2="222" stroke="#9aa3b2" stroke-width="2" marker-end="url(#rlMbArrow)"/>
  <text x="240" y="160" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">learn</text>
  <line x1="160" y1="250" x2="100" y2="184" stroke="#9aa3b2" stroke-width="2" marker-end="url(#rlMbArrow)"/>
  <text x="96" y="216" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">act better</text>
  <text x="230" y="22" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="11">Dyna: one real step funds one real plus k imagined value updates</text>
</svg>
