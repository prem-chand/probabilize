<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="240" viewBox="0 0 460 240">
<rect width="460" height="240" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(10 5)">
  
  <line x1="60" y1="130" x2="380" y2="130" stroke="var(--border-subtle)" stroke-width="1.5"/>
  <line x1="220" y1="40" x2="220" y2="200" stroke="var(--border-subtle)" stroke-width="1.5"/>
  <g stroke="var(--figure-structure)" fill="none">
    <ellipse cx="220" cy="130" rx="130" ry="52" stroke-width="1.5" opacity="0.5" transform="rotate(-24 220 130)"/>
    <ellipse cx="220" cy="130" rx="92" ry="37" stroke-width="1.5" opacity="0.7" transform="rotate(-24 220 130)"/>
    <ellipse cx="220" cy="130" rx="54" ry="22" stroke-width="2" transform="rotate(-24 220 130)"/>
  </g>
  <line x1="220" y1="130" x2="300" y2="94" stroke="var(--figure-accent)" stroke-width="2"/>
  <line x1="220" y1="130" x2="238" y2="172" stroke="var(--figure-flow)" stroke-width="2"/>
  <circle cx="220" cy="130" r="4" fill="var(--text-strong)"/>
  <text x="306" y="90" fill="var(--figure-accent)" font-family="var(--font-mono)" font-size="10">eigvec λ₁</text>
  <text x="246" y="182" fill="var(--figure-flow)" font-family="var(--font-mono)" font-size="10">eigvec λ₂</text>
  <text x="220" y="26" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="11">a multivariate Gaussian is a mean plus a covariance ellipsoid</text>
  <text x="220" y="216" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">the eigenvectors of Σ give the axes, the eigenvalues the lengths</text>
</g>
</svg>