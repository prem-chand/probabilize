<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="240" viewBox="0 0 460 240">
<rect width="460" height="240" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(5 0)">
  
  <g stroke="var(--border-subtle)" stroke-width="1.5">
    <ellipse cx="225" cy="120" rx="180" ry="46"/><ellipse cx="225" cy="120" rx="130" ry="34"/>
    <ellipse cx="225" cy="120" rx="80" ry="22"/><ellipse cx="225" cy="120" rx="30" ry="10"/>
  </g>
  <polyline points="400,86 340,150 300,92 268,148 248,98 236,142 229,112 226,134 225,120"
    stroke="var(--figure-accent)" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <polyline points="400,86 300,124 246,122 225,120" stroke="var(--figure-structure)" stroke-width="2" fill="none"/>
  <g fill="var(--figure-structure)"><circle cx="400" cy="86" r="4"/><circle cx="300" cy="124" r="4"/><circle cx="246" cy="122" r="4"/></g>
  <circle cx="225" cy="120" r="5" fill="var(--figure-flow)"/>
  <text x="230" y="30" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="11">Newton rescales by the Hessian, so it does not zigzag</text>
  <text x="300" y="62" fill="var(--figure-accent)" font-family="var(--font-mono)" font-size="10">gradient descent</text>
  <text x="316" y="150" fill="var(--figure-structure)" font-family="var(--font-mono)" font-size="10">Newton</text>
  <text x="225" y="212" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">cost per step is higher, but far fewer steps are needed</text>
</g>
</svg>