<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="240" viewBox="0 0 460 240">
<rect width="460" height="240" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(10 0)">
  
  <line x1="220" y1="24" x2="220" y2="216" stroke="var(--border-subtle)" stroke-width="1.5"/>
  <path d="M30 190 Q120 150 200 70" stroke="var(--figure-flow)" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
  <path d="M30 190 Q120 190 200 150" stroke="var(--figure-alert)" stroke-width="2" fill="none"/>
  <path d="M120 190 Q170 175 200 150" stroke="var(--figure-alert)" stroke-width="1.5" fill="var(--figure-alert)" fill-opacity="0.12"/>
  <text x="110" y="42" text-anchor="middle" fill="var(--figure-alert)" font-family="var(--font-mono)" font-size="11">behavior cloning</text>
  <text x="112" y="200" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">small error leaves the expert</text>
  <text x="112" y="214" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">trajectory and compounds</text>
  <text x="200" y="62" fill="var(--figure-flow)" font-family="var(--font-mono)" font-size="10">expert</text>
  <text x="196" y="158" fill="var(--figure-alert)" font-family="var(--font-mono)" font-size="10">BC</text>
  <path d="M250 190 Q330 150 400 70" stroke="var(--figure-flow)" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
  <path d="M250 190 Q330 178 400 140" stroke="var(--figure-structure)" stroke-width="2" fill="none"/>
  <rect x="290" y="150" width="120" height="34" rx="6" fill="var(--figure-accent)" fill-opacity="0.18" stroke="var(--figure-accent)" stroke-width="1.5"/>
  <text x="350" y="171" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="10">add corrections to D</text>
  <path d="M400 140 L360 158" stroke="var(--figure-structure)" stroke-width="1.5" marker-end="url(#rbDaggerArrow)"/>
  <defs>
    <marker id="rbDaggerArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="var(--figure-structure)"/></marker>
  </defs>
  <text x="330" y="42" text-anchor="middle" fill="var(--figure-structure)" font-family="var(--font-mono)" font-size="11">DAgger</text>
  <text x="330" y="200" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">expert labels the visited states</text>
  <text x="220" y="225" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">the fix for compounding error: train on the policy's own states</text>
</g>
</svg>