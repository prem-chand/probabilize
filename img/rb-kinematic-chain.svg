<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="300" viewBox="0 0 460 300">
<rect width="460" height="300" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(20 6)">
  
  <line x1="40" y1="242" x2="380" y2="242" stroke="var(--border-default)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="70" y="210" width="52" height="30" rx="4" fill="var(--border-default)"/>
  <line x1="96" y1="205" x2="186" y2="126" stroke="var(--figure-structure)" stroke-width="6" stroke-linecap="round"/>
  <line x1="186" y1="126" x2="266" y2="96" stroke="var(--figure-structure)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="96" cy="205" r="7" fill="var(--figure-accent)"/>
  <circle cx="186" cy="126" r="7" fill="var(--figure-accent)"/>
  <rect x="258" y="88" width="16" height="16" rx="2" fill="var(--figure-flow)"/>
  <path d="M104 213 A18 18 0 0 1 118 197" stroke="var(--figure-accent)" stroke-width="1.5" fill="none"/>
  <path d="M194 134 A18 18 0 0 1 207 118" stroke="var(--figure-accent)" stroke-width="1.5" fill="none"/>
  <text x="210" y="26" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="11">joint angles θ map to an end-effector pose x</text>
  <text x="128" y="196" fill="var(--figure-accent)" font-family="var(--font-mono)" font-size="11">θ1</text>
  <text x="198" y="136" fill="var(--figure-accent)" font-family="var(--font-mono)" font-size="11">θ2</text>
  <text x="80" y="260" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">base</text>
  <text x="280" y="86" fill="var(--figure-flow)" font-family="var(--font-mono)" font-size="11">x ∈ SE(3)</text>
  <text x="210" y="272" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">forward kinematics: θ → x; inverse kinematics: x → θ</text>
</g>
</svg>