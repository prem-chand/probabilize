<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="300" viewBox="0 0 460 300">
<rect width="460" height="300" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(0 20)">
  
  <defs>
    <marker id="rlOacArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="var(--text-muted)"/></marker>
  </defs>
  <rect x="20" y="28" width="420" height="54" rx="8" fill="var(--figure-structure)" fill-opacity="0.14" stroke="var(--figure-structure)" stroke-width="1.5"/>
  <text x="230" y="50" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="11">shared skeleton: replay buffer D · Polyak target networks</text>
  <text x="230" y="66" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="11">separate actor + critic</text>
  <rect x="30" y="112" width="110" height="58" rx="8" fill="var(--figure-structure)" fill-opacity="0.2" stroke="var(--figure-structure)" stroke-width="1.5"/>
  <text x="85" y="138" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="12">DDPG</text>
  <text x="85" y="156" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">deterministic</text>
  <rect x="175" y="112" width="110" height="58" rx="8" fill="var(--figure-accent)" fill-opacity="0.18" stroke="var(--figure-accent)" stroke-width="1.5"/>
  <text x="230" y="138" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="12">TD3</text>
  <text x="230" y="156" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">twin critics</text>
  <rect x="320" y="112" width="110" height="58" rx="8" fill="var(--figure-flow)" fill-opacity="0.2" stroke="var(--figure-flow)" stroke-width="1.5"/>
  <text x="375" y="138" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="12">SAC</text>
  <text x="375" y="156" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">max-entropy</text>
  <line x1="140" y1="141" x2="175" y2="141" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#rlOacArrow)"/>
  <line x1="285" y1="141" x2="320" y2="141" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#rlOacArrow)"/>
  <text x="157" y="196" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">fixes</text>
  <text x="302" y="196" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">adds</text>
  <text x="85" y="212" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">overestimation</text>
  <text x="230" y="212" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">delayed policy + noise</text>
  <text x="375" y="212" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">auto-tuned α</text>
  <text x="230" y="242" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">each algorithm inherits its predecessor and adds one targeted fix</text>
</g>
</svg>