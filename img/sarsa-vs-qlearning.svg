<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="300" viewBox="0 0 460 300">
<rect width="460" height="300" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(0 30.4) scale(0.92)">
  
  <!-- Left: SARSA -->
  <text x="125" y="24" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="11" font-weight="600">SARSA (on-policy)</text>
  <rect x="85" y="36" width="80" height="28" rx="6" fill="var(--figure-structure)" opacity="0.85"/>
  <text x="125" y="54" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="11">s, a</text>
  <rect x="85" y="84" width="80" height="28" rx="6" fill="var(--figure-accent)" opacity="0.8"/>
  <text x="125" y="102" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="11">r, s'</text>
  <line x1="125" y1="64" x2="125" y2="84" stroke="var(--border-default)" stroke-width="1.5"/>
  <rect x="85" y="130" width="80" height="28" rx="6" fill="var(--figure-flow)" opacity="0.7"/>
  <text x="125" y="148" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="11">a' (actual)</text>
  <line x1="125" y1="112" x2="125" y2="130" stroke="var(--border-default)" stroke-width="1.5"/>
  <text x="125" y="196" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">Q ← Q + α[r + γQ(s',a') − Q]</text>

  <!-- Right: Q-learning -->
  <text x="375" y="24" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="11" font-weight="600">Q-learning (off-policy)</text>
  <rect x="335" y="36" width="80" height="28" rx="6" fill="var(--figure-structure)" opacity="0.85"/>
  <text x="375" y="54" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="11">s, a</text>
  <rect x="335" y="84" width="80" height="28" rx="6" fill="var(--figure-accent)" opacity="0.8"/>
  <text x="375" y="102" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="11">r, s'</text>
  <line x1="375" y1="64" x2="375" y2="84" stroke="var(--border-default)" stroke-width="1.5"/>
  <rect x="335" y="130" width="80" height="28" rx="6" fill="var(--figure-flow)" opacity="0.7"/>
  <text x="375" y="148" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="11">max a'</text>
  <line x1="375" y1="112" x2="375" y2="130" stroke="var(--border-default)" stroke-width="1.5"/>
  <text x="375" y="196" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">Q ← Q + α[r + γ max Q − Q]</text>

  <!-- Separator -->
  <line x1="250" y1="8" x2="250" y2="200" stroke="var(--border-subtle)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- Caption -->
  <text x="250" y="244" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">SARSA uses actual next action a'; Q-learning uses max over all actions</text>
</g>
</svg>