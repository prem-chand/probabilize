<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 270" fill="none">
  <rect width="460" height="270" fill="var(--surface-sunken, #07090c)" rx="14"/>
  <defs>
    <marker id="rlOffAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#f5a623"/></marker>
  </defs>
  <rect x="30" y="70" width="150" height="70" rx="8" fill="#5879fb" fill-opacity="0.2" stroke="#5879fb" stroke-width="1.6"/>
  <text x="105" y="100" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12">agent π</text>
  <text x="105" y="118" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">learner</text>
  <rect x="280" y="70" width="150" height="70" rx="8" fill="#16a36b" fill-opacity="0.2" stroke="#16a36b" stroke-width="1.6"/>
  <text x="355" y="100" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12">environment</text>
  <text x="355" y="118" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">not queryable</text>
  <rect x="155" y="186" width="150" height="62" rx="8" fill="#f5a623" fill-opacity="0.18" stroke="#f5a623" stroke-width="1.6"/>
  <text x="230" y="212" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12">fixed dataset D</text>
  <text x="230" y="230" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">collected by π_β</text>
  <line x1="180" y1="105" x2="280" y2="105" stroke="#e5484d" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="222" y1="97" x2="238" y2="113" stroke="#e5484d" stroke-width="2.5"/>
  <line x1="238" y1="97" x2="222" y2="113" stroke="#e5484d" stroke-width="2.5"/>
  <text x="230" y="88" text-anchor="middle" fill="#e5484d" font-family="monospace" font-size="10">no new interaction</text>
  <line x1="355" y1="140" x2="280" y2="186" stroke="#9aa3b2" stroke-width="1.6" stroke-dasharray="4 4"/>
  <text x="352" y="172" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="9">logged once</text>
  <line x1="180" y1="186" x2="120" y2="140" stroke="#f5a623" stroke-width="2" marker-end="url(#rlOffAmber)"/>
  <text x="112" y="168" fill="#f5a623" font-family="monospace" font-size="10">train only</text>
  <text x="230" y="30" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="11">offline RL: everything is learned from one fixed dataset</text>
  <text x="230" y="52" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">no correction loop — the policy cannot test its mistakes</text>
</svg>
