<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="300" viewBox="0 0 460 300">
<rect width="460" height="300" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(0 15)">
  
  <defs>
    <marker id="rlOffAmber" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="var(--figure-accent)"/></marker>
  </defs>
  <rect x="30" y="70" width="150" height="70" rx="8" fill="var(--figure-structure)" fill-opacity="0.2" stroke="var(--figure-structure)" stroke-width="1.5"/>
  <text x="105" y="100" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="12">agent π</text>
  <text x="105" y="118" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">learner</text>
  <rect x="280" y="70" width="150" height="70" rx="8" fill="var(--figure-flow)" fill-opacity="0.2" stroke="var(--figure-flow)" stroke-width="1.5"/>
  <text x="355" y="100" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="12">environment</text>
  <text x="355" y="118" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">not queryable</text>
  <rect x="155" y="186" width="150" height="62" rx="8" fill="var(--figure-accent)" fill-opacity="0.18" stroke="var(--figure-accent)" stroke-width="1.5"/>
  <text x="230" y="212" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="12">fixed dataset D</text>
  <text x="230" y="230" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">collected by π_β</text>
  <line x1="180" y1="105" x2="280" y2="105" stroke="var(--figure-alert)" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="222" y1="97" x2="238" y2="113" stroke="var(--figure-alert)" stroke-width="2"/>
  <line x1="238" y1="97" x2="222" y2="113" stroke="var(--figure-alert)" stroke-width="2"/>
  <text x="230" y="88" text-anchor="middle" fill="var(--figure-alert)" font-family="var(--font-mono)" font-size="10">no new interaction</text>
  <line x1="355" y1="140" x2="280" y2="186" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="352" y="172" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">logged once</text>
  <line x1="180" y1="186" x2="120" y2="140" stroke="var(--figure-accent)" stroke-width="2" marker-end="url(#rlOffAmber)"/>
  <text x="112" y="168" fill="var(--figure-accent)" font-family="var(--font-mono)" font-size="10">train only</text>
  <text x="230" y="30" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="11">offline RL: everything is learned from one fixed dataset</text>
  <text x="230" y="52" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">no correction loop — the policy cannot test its mistakes</text>
</g>
</svg>