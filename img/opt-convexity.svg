<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="300" viewBox="0 0 460 300">
<rect width="460" height="300" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(10 20)">
  
  <line x1="220" y1="26" x2="220" y2="234" stroke="var(--border-subtle)" stroke-width="1.5"/>
  <path d="M40 150 Q110 20 180 150" stroke="var(--figure-structure)" stroke-width="2" fill="none"/>
  <line x1="40" y1="150" x2="180" y2="150" stroke="var(--figure-accent)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="60" y1="85" x2="160" y2="85" stroke="var(--figure-flow)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="110" y="42" text-anchor="middle" fill="var(--figure-structure)" font-family="var(--font-mono)" font-size="11">convex f</text>
  <text x="110" y="164" text-anchor="middle" fill="var(--figure-accent)" font-family="var(--font-mono)" font-size="10">chord lies above</text>
  <text x="110" y="79" text-anchor="middle" fill="var(--figure-flow)" font-family="var(--font-mono)" font-size="10">tangent lies below</text>
  <path d="M260 60 Q330 190 400 60" stroke="var(--figure-alert)" stroke-width="2" fill="none"/>
  <line x1="260" y1="60" x2="400" y2="60" stroke="var(--figure-accent)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="330" y="42" text-anchor="middle" fill="var(--figure-alert)" font-family="var(--font-mono)" font-size="11">nonconvex</text>
  <text x="330" y="150" text-anchor="middle" fill="var(--figure-accent)" font-family="var(--font-mono)" font-size="10">chord cuts below the curve</text>
  <text x="220" y="248" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">convexity is a statement about every chord and tangent</text>
</g>
</svg>