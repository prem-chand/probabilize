  <rect width="440" height="260" fill="var(--surface-sunken, #07090c)" rx="14"/>
  <line x1="220" y1="26" x2="220" y2="234" stroke="var(--border-subtle, #21262f)" stroke-width="1"/>
  <path d="M40 150 Q110 20 180 150" stroke="#5879fb" stroke-width="2.5" fill="none"/>
  <line x1="40" y1="150" x2="180" y2="150" stroke="#f5a623" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="60" y1="85" x2="160" y2="85" stroke="#16a36b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="110" y="42" text-anchor="middle" fill="#5879fb" font-family="monospace" font-size="11">convex f</text>
  <text x="110" y="164" text-anchor="middle" fill="#f5a623" font-family="monospace" font-size="10">chord lies above</text>
