<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="300" viewBox="0 0 460 300">
<rect width="460" height="300" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(20 10)">
  
  <defs>
    <marker id="optProjBrand" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="var(--figure-structure)"/></marker>
    <marker id="optProjAmber" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="var(--figure-accent)"/></marker>
  </defs>
  <circle cx="150" cy="160" r="80" fill="var(--figure-structure)" fill-opacity="0.12" stroke="var(--figure-structure)" stroke-width="2"/>
  <line x1="150" y1="240" x2="150" y2="60" stroke="var(--border-subtle)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="70" y1="160" x2="260" y2="160" stroke="var(--border-subtle)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="360" y1="80" x2="219" y2="133" stroke="var(--figure-accent)" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#optProjAmber)"/>
  <line x1="360" y1="80" x2="310" y2="110" stroke="var(--figure-structure)" stroke-width="2" marker-end="url(#optProjBrand)"/>
  <circle cx="219" cy="133" r="4.5" fill="var(--figure-flow)"/>
  <circle cx="360" cy="80" r="4.5" fill="var(--figure-accent)"/>
  <text x="210" y="26" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="11">projection returns the nearest feasible point</text>
  <text x="150" y="256" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="11">feasible set C</text>
  <text x="366" y="74" fill="var(--figure-accent)" font-family="var(--font-mono)" font-size="11">v</text>
  <text x="226" y="128" fill="var(--figure-flow)" font-family="var(--font-mono)" font-size="11">P_C(v)</text>
</g>
</svg>