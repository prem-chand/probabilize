<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 230" fill="none">
  <rect width="460" height="230" fill="var(--surface-sunken, #07090c)" rx="14"/>
  <defs>
    <marker id="rbClArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#9aa3b2"/></marker>
  </defs>
  <circle cx="120" cy="100" r="17" stroke="var(--border-default, #343a48)" stroke-width="1.6" fill="none"/>
  <text x="120" y="106" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="13">Σ</text>
  <rect x="175" y="70" width="120" height="60" rx="8" fill="#5879fb" fill-opacity="0.2" stroke="#5879fb" stroke-width="1.6"/>
  <text x="235" y="97" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12">controller</text>
  <text x="235" y="115" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">PID / LQR</text>
  <rect x="340" y="70" width="105" height="60" rx="8" fill="#16a36b" fill-opacity="0.2" stroke="#16a36b" stroke-width="1.6"/>
  <text x="392" y="105" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12">plant</text>
  <line x1="20" y1="100" x2="103" y2="100" stroke="#16a36b" stroke-width="2" marker-end="url(#rbClArrow)"/>
  <text x="40" y="90" fill="#16a36b" font-family="monospace" font-size="10">reference r</text>
  <line x1="137" y1="100" x2="175" y2="100" stroke="#9aa3b2" stroke-width="2" marker-end="url(#rbClArrow)"/>
  <text x="156" y="90" text-anchor="middle" fill="#9aa3b2" font-family="monospace" font-size="10">e</text>
  <line x1="295" y1="100" x2="340" y2="100" stroke="#9aa3b2" stroke-width="2" marker-end="url(#rbClArrow)"/>
  <text x="318" y="90" text-anchor="middle" fill="#9aa3b2" font-family="monospace" font-size="10">u</text>
  <text x="416" y="60" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10">output y</text>
  <path d="M392 130 L392 180 L120 180 L120 117" stroke="#f5a623" stroke-width="1.8" fill="none" marker-end="url(#rbClArrow)"/>
  <text x="256" y="198" text-anchor="middle" fill="#f5a623" font-family="monospace" font-size="10">sensor measurement (feedback, subtracted at Σ)</text>
  <text x="230" y="24" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="11">feedback control: measure the error and correct continuously</text>
