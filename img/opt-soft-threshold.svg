<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" fill="none">
  <rect width="420" height="300" fill="var(--surface-sunken, #07090c)" rx="14"/>
  <g stroke="var(--border-subtle, #21262f)" stroke-width="1">
    <line x1="30" y1="150" x2="390" y2="150"/>
    <line x1="210" y1="30" x2="210" y2="270"/>
  </g>
  <line x1="120" y1="230" x2="300" y2="50" stroke="var(--border-default, #343a48)" stroke-width="1.2" stroke-dasharray="5 4"/>
  <g stroke="#f5a623" stroke-width="1" stroke-dasharray="4 3">
    <line x1="180" y1="60" x2="180" y2="240"/>
    <line x1="240" y1="60" x2="240" y2="240"/>
  </g>
  <path d="M90 230 L180 150 L240 150 L330 50" stroke="#5879fb" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
  <text x="210" y="24" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="11">prox of ηλ‖·‖₁: shrink toward 0, then clip</text>
  <text x="345" y="46" fill="#5879fb" font-family="monospace" font-size="11">prox(v)</text>
  <text x="312" y="72" fill="var(--border-default, #343a48)" font-family="monospace" font-size="10">y = v</text>
  <text x="150" y="126" fill="#f5a623" font-family="monospace" font-size="10">−ηλ</text>
  <text x="246" y="126" fill="#f5a623" font-family="monospace" font-size="10">+ηλ</text>
  <text x="210" y="166" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">vanish to exactly 0</text>
  <text x="210" y="286" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">sign(v) · max(|v| − ηλ, 0) is why ISTA produces sparse solutions</text>
</svg>
