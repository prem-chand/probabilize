<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="300" viewBox="0 0 460 300">
<rect width="460" height="300" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(20 0)">
  
  <g stroke="var(--border-subtle)" stroke-width="1.5">
    <line x1="30" y1="150" x2="390" y2="150"/>
    <line x1="210" y1="30" x2="210" y2="270"/>
  </g>
  <line x1="120" y1="230" x2="300" y2="50" stroke="var(--border-default)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g stroke="var(--figure-accent)" stroke-width="1.5" stroke-dasharray="4 3">
    <line x1="180" y1="60" x2="180" y2="240"/>
    <line x1="240" y1="60" x2="240" y2="240"/>
  </g>
  <path d="M90 230 L180 150 L240 150 L330 50" stroke="var(--figure-structure)" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <text x="210" y="24" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="11">prox of ηλ‖·‖₁: shrink toward 0, then clip</text>
  <text x="345" y="46" fill="var(--figure-structure)" font-family="var(--font-mono)" font-size="11">prox(v)</text>
  <text x="312" y="72" fill="var(--border-default)" font-family="var(--font-mono)" font-size="10">y = v</text>
  <text x="150" y="126" fill="var(--figure-accent)" font-family="var(--font-mono)" font-size="10">−ηλ</text>
  <text x="246" y="126" fill="var(--figure-accent)" font-family="var(--font-mono)" font-size="10">+ηλ</text>
  <text x="210" y="166" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">vanish to exactly 0</text>
  <text x="210" y="286" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">sign(v) · max(|v| − ηλ, 0) is why ISTA produces sparse solutions</text>
</g>
</svg>