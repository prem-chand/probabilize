<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="240" viewBox="0 0 460 240">
<rect width="460" height="240" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(30 20)">
  
  <!-- Agent box -->
  <rect x="40" y="60" width="120" height="80" rx="10" fill="var(--figure-structure)" opacity="0.85"/>
  <text x="100" y="88" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="12" font-weight="600">Agent</text>
  <text x="100" y="106" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="10">policy π(a|s)</text>
  <text x="100" y="122" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="10">value function</text>
  <!-- Environment box -->
  <rect x="240" y="60" width="120" height="80" rx="10" fill="var(--figure-flow)" opacity="0.5"/>
  <text x="300" y="94" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="12" font-weight="600">Environment</text>
  <text x="300" y="112" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="10">dynamics P(s'|s,a)</text>
  <!-- Action arrow: Agent → Environment -->
  <line x1="160" y1="80" x2="240" y2="80" stroke="var(--figure-accent)" stroke-width="2"/>
  <text x="200" y="72" text-anchor="middle" fill="var(--figure-accent)" font-family="var(--font-mono)" font-size="11" font-weight="600">action a</text>
  <!-- Reward + next state arrow: Environment → Agent -->
  <line x1="240" y1="120" x2="160" y2="120" stroke="var(--figure-flow)" stroke-width="2"/>
  <text x="200" y="140" text-anchor="middle" fill="var(--figure-flow)" font-family="var(--font-mono)" font-size="10">reward r, next state s'</text>
  <!-- Caption -->
  <text x="200" y="186" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">Standard RL interaction cycle</text>
</g>
</svg>