<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="240" viewBox="0 0 460 240">
<rect width="460" height="240" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(0 28) scale(0.92)">
  
  <!-- Decay curve -->
  <text x="60" y="30" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="11">e(s)</text>
  <!-- Time steps -->
  <rect x="80" y="60" width="60" height="40" rx="6" fill="var(--figure-structure)" opacity="0.7"/>
  <text x="110" y="80" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="11">visit</text>
  <text x="110" y="94" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="10">e(s)+=1</text>

  <rect x="180" y="70" width="60" height="30" rx="6" fill="var(--figure-accent)" opacity="0.6"/>
  <text x="210" y="90" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="10">×γλ</text>

  <rect x="280" y="80" width="60" height="30" rx="6" fill="var(--figure-accent)" opacity="0.5"/>
  <text x="310" y="100" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="10">×γλ</text>

  <rect x="380" y="90" width="60" height="30" rx="6" fill="var(--figure-accent)" opacity="0.4"/>
  <text x="410" y="110" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="10">×γλ</text>

  <!-- Arrows between steps -->
  <line x1="140" y1="80" x2="180" y2="85" stroke="var(--border-default)" stroke-width="1.5"/>
  <line x1="240" y1="85" x2="280" y2="95" stroke="var(--border-default)" stroke-width="1.5"/>
  <line x1="340" y1="95" x2="380" y2="105" stroke="var(--border-default)" stroke-width="1.5"/>

  <!-- Decay label -->
  <text x="250" y="155" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">Each time step: e(s) ← γλ · e(s); on visit: e(s) ← e(s) + 1</text>
  <text x="250" y="178" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">TD error δ flows backward through trace e(s) weighted by step</text>
</g>
</svg>