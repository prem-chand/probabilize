    <marker id="laProjBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#5879fb"/></marker>
  </defs>
  <line x1="20" y1="260" x2="280" y2="0" stroke="var(--border-default, #343a48)" stroke-width="1.5"/>
  <line x1="60" y1="220" x2="220" y2="140" stroke="#f5a623" stroke-width="2.5" marker-end="url(#laProjAmber)"/>
