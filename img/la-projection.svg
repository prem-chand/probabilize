<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="300" viewBox="0 0 460 300">
<rect width="460" height="300" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(20 20)">
  
  <defs>
    <marker id="laProjAmber" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="var(--figure-accent)"/></marker>
    <marker id="laProjBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="var(--figure-structure)"/></marker>
  </defs>
  <line x1="20" y1="260" x2="280" y2="0" stroke="var(--border-default)" stroke-width="1.5"/>
  <line x1="60" y1="220" x2="220" y2="140" stroke="var(--figure-accent)" stroke-width="2" marker-end="url(#laProjAmber)"/>
  <line x1="60" y1="220" x2="180" y2="100" stroke="var(--figure-structure)" stroke-width="2" marker-end="url(#laProjBlue)"/>
  <line x1="180" y1="100" x2="220" y2="140" stroke="var(--figure-flow)" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M180 100 L187 93 L194 100 L187 107 Z" stroke="var(--figure-flow)" stroke-width="1.5" fill="none"/>
  <text x="210" y="24" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="11">projection of b onto the line span{a}</text>
  <text x="228" y="136" fill="var(--figure-accent)" font-family="var(--font-mono)" font-size="12">b</text>
  <text x="145" y="88" text-anchor="middle" fill="var(--figure-structure)" font-family="var(--font-mono)" font-size="12">p = Pb</text>
  <text x="240" y="122" fill="var(--figure-flow)" font-family="var(--font-mono)" font-size="11">e = b − p</text>
  <text x="120" y="212" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">a</text>
</g>
</svg>