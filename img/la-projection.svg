  <text x="210" y="24" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="11">projection of b onto the line span{a}</text>
  <text x="228" y="136" fill="#f5a623" font-family="monospace" font-size="12">b</text>
  <text x="160" y="96" fill="#5879fb" font-family="monospace" font-size="12">p = Pb</text>
  <text x="196" y="158" fill="#16a36b" font-family="monospace" font-size="11">e = b − p</text>
  <text x="120" y="212" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">a</text>
