<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" fill="none">
  <rect width="420" height="300" fill="var(--surface-sunken, #07090c)" rx="14"/>
  <defs>
    <marker id="optSaddleRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#e5484d"/></marker>
    <marker id="optSaddleBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#5879fb"/></marker>
  </defs>
  <g stroke="var(--border-subtle, #21262f)" stroke-width="1" stroke-dasharray="4 4">
    <line x1="80" y1="70" x2="340" y2="230"/>
    <line x1="80" y1="230" x2="340" y2="70"/>
  </g>
  <g stroke="#5879fb" stroke-width="1.6" opacity="0.7" fill="none">
    <path d="M250 80 C 300 110, 300 190, 250 220"/>
    <path d="M170 80 C 120 110, 120 190, 170 220"/>
    <path d="M165 95 C 195 55, 245 55, 275 95"/>
    <path d="M165 205 C 195 245, 245 245, 275 205"/>
  </g>
  <line x1="210" y1="150" x2="320" y2="150" stroke="#e5484d" stroke-width="2" marker-end="url(#optSaddleRed)"/>
  <line x1="210" y1="150" x2="100" y2="150" stroke="#e5484d" stroke-width="2" marker-end="url(#optSaddleRed)"/>
  <line x1="210" y1="150" x2="210" y2="90" stroke="#5879fb" stroke-width="2" marker-end="url(#optSaddleBlue)"/>
  <line x1="210" y1="150" x2="210" y2="210" stroke="#5879fb" stroke-width="2" marker-end="url(#optSaddleBlue)"/>
  <circle cx="210" cy="150" r="5" fill="#ffffff"/>
  <text x="210" y="26" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="11">at a saddle, ∇f = 0 but curvature changes sign</text>
  <text x="292" y="176" fill="#e5484d" font-family="monospace" font-size="10">escape</text>
  <text x="222" y="84" fill="#5879fb" font-family="monospace" font-size="10">attract</text>
  <text x="210" y="290" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">in high dimensions, most critical points are saddles — gradient flow slides off</text>
</svg>
