<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="240" viewBox="0 0 460 240">
<rect width="460" height="240" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(0 5)">
  
  <defs>
    <marker id="paLoraArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="var(--text-muted)"/></marker>
  </defs>
  <rect x="30" y="70" width="96" height="96" rx="8" fill="var(--border-default)" fill-opacity="0.5" stroke="var(--border-default)" stroke-width="1.5"/>
  <text x="78" y="112" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="11">W</text>
  <text x="78" y="132" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">frozen</text>
  <text x="146" y="123" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="12">+</text>
  <rect x="166" y="70" width="96" height="96" rx="8" fill="var(--figure-structure)" fill-opacity="0.2" stroke="var(--figure-structure)" stroke-width="1.5"/>
  <text x="214" y="112" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="11">ΔW = BA</text>
  <text x="214" y="132" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">trainable</text>
  <line x1="262" y1="118" x2="300" y2="118" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#paLoraArrow)"/>
  <rect x="308" y="66" width="34" height="60" rx="4" fill="var(--figure-accent)" fill-opacity="0.25" stroke="var(--figure-accent)" stroke-width="1.5"/>
  <text x="325" y="142" text-anchor="middle" fill="var(--figure-accent)" font-family="var(--font-mono)" font-size="10">B (d×r)</text>
  <text x="352" y="102" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="12">×</text>
  <rect x="368" y="86" width="66" height="34" rx="4" fill="var(--figure-accent)" fill-opacity="0.25" stroke="var(--figure-accent)" stroke-width="1.5"/>
  <text x="401" y="142" text-anchor="middle" fill="var(--figure-accent)" font-family="var(--font-mono)" font-size="10">A (r×k)</text>
  <text x="230" y="30" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="11">LoRA: keep the big weights frozen, learn a low-rank correction</text>
  <text x="230" y="196" text-anchor="middle" fill="var(--figure-structure)" font-family="var(--font-mono)" font-size="10">h = Wx + BAx — only A and B receive gradients</text>
  <text x="230" y="214" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">rank r ≪ d, k means a tiny fraction of the parameters to train</text>
</g>
</svg>