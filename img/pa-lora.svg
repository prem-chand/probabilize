<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 230" fill="none">
  <rect width="460" height="230" fill="var(--surface-sunken, #07090c)" rx="14"/>
  <defs>
    <marker id="paLoraArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#9aa3b2"/></marker>
  </defs>
  <rect x="30" y="70" width="96" height="96" rx="8" fill="var(--border-default, #343a48)" fill-opacity="0.5" stroke="var(--border-default, #343a48)" stroke-width="1.5"/>
  <text x="78" y="112" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">W</text>
  <text x="78" y="132" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="9">frozen</text>
  <text x="146" y="123" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="16">+</text>
  <rect x="166" y="70" width="96" height="96" rx="8" fill="#5879fb" fill-opacity="0.2" stroke="#5879fb" stroke-width="1.6"/>
  <text x="214" y="112" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">ΔW = BA</text>
  <text x="214" y="132" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="9">trainable</text>
  <line x1="262" y1="118" x2="300" y2="118" stroke="#9aa3b2" stroke-width="2" marker-end="url(#paLoraArrow)"/>
  <rect x="308" y="66" width="34" height="60" rx="4" fill="#f5a623" fill-opacity="0.25" stroke="#f5a623" stroke-width="1.3"/>
  <text x="325" y="142" text-anchor="middle" fill="#f5a623" font-family="monospace" font-size="9">B (d×r)</text>
  <text x="352" y="102" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="13">×</text>
  <rect x="368" y="86" width="66" height="34" rx="4" fill="#f5a623" fill-opacity="0.25" stroke="#f5a623" stroke-width="1.3"/>
  <text x="401" y="142" text-anchor="middle" fill="#f5a623" font-family="monospace" font-size="9">A (r×k)</text>
  <text x="230" y="30" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="11">LoRA: keep the big weights frozen, learn a low-rank correction</text>
  <text x="230" y="196" text-anchor="middle" fill="#5879fb" font-family="monospace" font-size="10">h = Wx + BAx — only A and B receive gradients</text>
  <text x="230" y="214" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">rank r ≪ d, k means a tiny fraction of the parameters to train</text>
</svg>
