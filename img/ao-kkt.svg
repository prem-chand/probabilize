  <line x1="200" y1="104" x2="236" y2="80" stroke="#f5a623" stroke-width="2"/>
  <text x="242" y="78" fill="#f5a623" font-family="monospace" font-size="10">∇f</text>
  <line x1="200" y1="104" x2="226" y2="132" stroke="#e5484d" stroke-width="2"/>
  <text x="232" y="144" fill="#e5484d" font-family="monospace" font-size="10">∇h (active)</text>
  <text x="258" y="80" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">stationarity: ∇f + Σλᵢ∇hᵢ = 0</text>
