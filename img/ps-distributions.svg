<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 210" fill="none">
  <rect width="470" height="210" fill="var(--surface-sunken, #07090c)" rx="14"/>
  <g stroke="var(--border-subtle, #21262f)" stroke-width="1.2">
    <line x1="30" y1="150" x2="140" y2="150"/>
    <line x1="30" y1="150" x2="30" y2="50"/>
    <line x1="180" y1="150" x2="290" y2="150"/>
    <line x1="180" y1="150" x2="180" y2="50"/>
    <line x1="330" y1="150" x2="440" y2="150"/>
    <line x1="330" y1="150" x2="330" y2="50"/>
  </g>
  <g fill="#5879fb" fill-opacity="0.7">
    <rect x="45" y="110" width="14" height="40" rx="2"/><rect x="65" y="80" width="14" height="70" rx="2"/>
    <rect x="85" y="60" width="14" height="90" rx="2"/><rect x="105" y="95" width="14" height="55" rx="2"/>
  </g>
  <text x="85" y="170" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="9">PMF (discrete)</text>
