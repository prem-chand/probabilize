<g transform="translate(0 17.23) scale(0.9787)">
  
  <g stroke="var(--border-subtle)" stroke-width="1.5">
    <line x1="30" y1="150" x2="140" y2="150"/>
    <line x1="30" y1="150" x2="30" y2="50"/>
    <line x1="180" y1="150" x2="290" y2="150"/>
    <line x1="180" y1="150" x2="180" y2="50"/>
    <line x1="330" y1="150" x2="440" y2="150"/>
    <line x1="330" y1="150" x2="330" y2="50"/>
  </g>
  <g fill="var(--figure-structure)" fill-opacity="0.7">
    <rect x="45" y="110" width="14" height="40" rx="2"/><rect x="65" y="80" width="14" height="70" rx="2"/>
    <rect x="85" y="60" width="14" height="90" rx="2"/><rect x="105" y="95" width="14" height="55" rx="2"/>
  </g>
  <text x="85" y="170" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">PMF (discrete)</text>
  <path d="M185 148 C 215 148, 220 62, 235 62 C 250 62, 255 148, 285 148" stroke="var(--figure-accent)" stroke-width="2" fill="none"/>
  <text x="235" y="170" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">PDF (continuous)</text>
  <path d="M335 146 L360 146 C 375 146, 375 96, 390 96 L415 96 L415 146 L440 146" stroke="var(--figure-flow)" stroke-width="2" fill="none"/>
  <text x="385" y="170" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">CDF (monotone → 1)</text>
  <text x="235" y="26" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="11">one random variable, three ways to describe it</text>
  <text x="235" y="192" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">PMF sums to 1 · PDF integrates to 1 · CDF is non-decreasing, 0 → 1</text>
