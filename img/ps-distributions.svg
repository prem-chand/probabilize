  <text x="235" y="170" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="9">PDF (continuous)</text>
  <path d="M335 146 L360 146 C 375 146, 375 96, 390 96 L415 96 L415 146 L440 146" stroke="#16a36b" stroke-width="2" fill="none"/>
  <text x="385" y="170" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="9">CDF (monotone → 1)</text>
  <text x="235" y="26" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="11">one random variable, three ways to describe it</text>
  <text x="235" y="192" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">PMF sums to 1 · PDF integrates to 1 · CDF is non-decreasing, 0 → 1</text>
