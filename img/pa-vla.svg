<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 230" fill="none">
  <rect width="470" height="230" fill="var(--surface-sunken, #07090c)" rx="14"/>
  <defs>
    <marker id="paVlaArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#9aa3b2"/></marker>
  </defs>
  <rect x="20" y="46" width="150" height="62" rx="8" fill="#5879fb" fill-opacity="0.2" stroke="#5879fb" stroke-width="1.6"/>
  <text x="95" y="74" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">System 2 (slow)</text>
  <text x="95" y="92" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="9">VLM plans, ~1 Hz</text>
  <rect x="20" y="138" width="150" height="62" rx="8" fill="#f5a623" fill-opacity="0.18" stroke="#f5a623" stroke-width="1.6"/>
  <text x="95" y="166" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">System 1 (fast)</text>
  <text x="95" y="184" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="9">action head, ~50 Hz</text>
  <rect x="310" y="92" width="140" height="62" rx="8" fill="#16a36b" fill-opacity="0.2" stroke="#16a36b" stroke-width="1.6"/>
  <text x="380" y="120" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">robot arm</text>
  <text x="380" y="138" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="9">manipulation</text>
  <line x1="95" y1="108" x2="95" y2="138" stroke="#9aa3b2" stroke-width="2" marker-end="url(#paVlaArrow)"/>
  <text x="128" y="128" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="9">subgoal / language</text>
  <line x1="170" y1="169" x2="310" y2="135" stroke="#9aa3b2" stroke-width="2" marker-end="url(#paVlaArrow)"/>
  <text x="240" y="160" text-anchor="middle" fill="#9aa3b2" font-family="monospace" font-size="9">action chunk</text>
  <path d="M380 154 L380 200 L95 200 L95 200" stroke="#9aa3b2" stroke-width="1.4" stroke-dasharray="4 4" fill="none"/>
  <text x="240" y="216" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="9">observations feed back to System 2</text>
  <text x="235" y="26" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="11">hierarchical VLA: a slow planner drives a fast action controller</text>
</svg>
