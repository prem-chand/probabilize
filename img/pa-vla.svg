<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="240" viewBox="0 0 460 240">
<rect width="460" height="240" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(0 7.45) scale(0.9787)">
  
  <defs>
    <marker id="paVlaArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="var(--text-muted)"/></marker>
  </defs>
  <rect x="20" y="46" width="150" height="62" rx="8" fill="var(--figure-structure)" fill-opacity="0.2" stroke="var(--figure-structure)" stroke-width="1.5"/>
  <text x="95" y="74" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="11">System 2 (slow)</text>
  <text x="95" y="92" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">VLM plans, ~1 Hz</text>
  <rect x="20" y="138" width="150" height="62" rx="8" fill="var(--figure-accent)" fill-opacity="0.18" stroke="var(--figure-accent)" stroke-width="1.5"/>
  <text x="95" y="166" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="11">System 1 (fast)</text>
  <text x="95" y="184" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">action head, ~50 Hz</text>
  <rect x="310" y="92" width="140" height="62" rx="8" fill="var(--figure-flow)" fill-opacity="0.2" stroke="var(--figure-flow)" stroke-width="1.5"/>
  <text x="380" y="120" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="11">robot arm</text>
  <text x="380" y="138" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">manipulation</text>
  <line x1="95" y1="108" x2="95" y2="138" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#paVlaArrow)"/>
  <text x="128" y="128" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">subgoal / language</text>
  <line x1="170" y1="169" x2="310" y2="135" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#paVlaArrow)"/>
  <text x="240" y="160" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">action chunk</text>
  <path d="M380 154 L380 200 L95 200 L95 200" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <text x="240" y="216" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">observations feed back to System 2</text>
  <text x="235" y="26" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="11">hierarchical VLA: a slow planner drives a fast action controller</text>
</g>
</svg>