<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="240" viewBox="0 0 460 240">
<rect width="460" height="240" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(5 0)">
  
  <ellipse cx="200" cy="120" rx="170" ry="82" fill="var(--figure-structure)" fill-opacity="0.1" stroke="var(--figure-structure)" stroke-width="1.5"/>
  <ellipse cx="200" cy="120" rx="130" ry="62" fill="var(--figure-accent)" fill-opacity="0.12" stroke="var(--figure-accent)" stroke-width="1.5"/>
  <ellipse cx="200" cy="120" rx="88" ry="42" fill="var(--figure-flow)" fill-opacity="0.13" stroke="var(--figure-flow)" stroke-width="1.5"/>
  <ellipse cx="200" cy="120" rx="46" ry="22" fill="var(--figure-alert)" fill-opacity="0.14" stroke="var(--figure-alert)" stroke-width="1.5"/>
  <text x="200" y="124" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="10">LP</text>
  <text x="200" y="100" text-anchor="middle" fill="var(--figure-alert)" font-family="var(--font-mono)" font-size="10">QP</text>
  <text x="200" y="72" text-anchor="middle" fill="var(--figure-flow)" font-family="var(--font-mono)" font-size="10">SOCP</text>
  <text x="200" y="44" text-anchor="middle" fill="var(--figure-accent)" font-family="var(--font-mono)" font-size="10">SDP</text>
  <text x="200" y="220" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">each outer class strictly contains the inner ones</text>
  <text x="225" y="26" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="11">convex program hierarchy: LP ⊂ QP ⊂ SOCP ⊂ SDP</text>
</g>
</svg>