<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 240" fill="none">
  <rect width="450" height="240" fill="var(--surface-sunken, #07090c)" rx="14"/>
  <ellipse cx="200" cy="120" rx="170" ry="82" fill="#5879fb" fill-opacity="0.1" stroke="#5879fb" stroke-width="1.4"/>
  <ellipse cx="200" cy="120" rx="130" ry="62" fill="#f5a623" fill-opacity="0.12" stroke="#f5a623" stroke-width="1.4"/>
  <ellipse cx="200" cy="120" rx="88" ry="42" fill="#16a36b" fill-opacity="0.13" stroke="#16a36b" stroke-width="1.4"/>
  <ellipse cx="200" cy="120" rx="46" ry="22" fill="#e5484d" fill-opacity="0.14" stroke="#e5484d" stroke-width="1.4"/>
  <text x="200" y="124" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="9">LP</text>
  <text x="200" y="100" text-anchor="middle" fill="#e5484d" font-family="monospace" font-size="9">QP</text>
  <text x="200" y="72" text-anchor="middle" fill="#16a36b" font-family="monospace" font-size="9">SOCP</text>
