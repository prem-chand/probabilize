<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="360" viewBox="0 0 460 360">
<rect width="460" height="360" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(30 17)">
  
  <!-- Root state -->
  <rect x="160" y="16" width="80" height="32" rx="6" fill="var(--figure-structure)" opacity="0.85"/>
  <text x="200" y="36" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="12" font-weight="600">s</text>
  <!-- Action nodes -->
  <rect x="80" y="80" width="60" height="28" rx="6" fill="var(--figure-accent)" opacity="0.8"/>
  <text x="110" y="98" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="11">a</text>
  <rect x="260" y="80" width="60" height="28" rx="6" fill="var(--figure-accent)" opacity="0.8"/>
  <text x="290" y="98" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="11">a</text>
  <!-- Connect root to actions -->
  <line x1="200" y1="48" x2="110" y2="80" stroke="var(--border-default)" stroke-width="1.5"/>
  <line x1="200" y1="48" x2="290" y2="80" stroke="var(--border-default)" stroke-width="1.5"/>
  <!-- Episode trajectory -->
  <path d="M110 108 L80 140" stroke="var(--figure-flow)" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="60" y="144" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">trajectory</text>
  <!-- Reward nodes -->
  <rect x="40" y="160" width="60" height="24" rx="4" fill="var(--text-muted)" opacity="0.5"/>
  <text x="70" y="176" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="10">r₁</text>
  <rect x="120" y="200" width="60" height="24" rx="4" fill="var(--text-muted)" opacity="0.5"/>
  <text x="150" y="216" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="10">r₂</text>
  <rect x="200" y="240" width="60" height="24" rx="4" fill="var(--text-muted)" opacity="0.5"/>
  <text x="230" y="256" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="10">r₃</text>
  <rect x="280" y="280" width="60" height="24" rx="4" fill="var(--figure-flow)" opacity="0.3"/>
  <text x="310" y="296" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="10">G₀</text>
  <!-- Connecting arrows -->
  <line x1="70" y1="184" x2="150" y2="200" stroke="var(--border-subtle)" stroke-width="1.5"/>
  <line x1="150" y1="224" x2="230" y2="240" stroke="var(--border-subtle)" stroke-width="1.5"/>
  <line x1="230" y1="264" x2="310" y2="280" stroke="var(--border-subtle)" stroke-width="1.5"/>
  <!-- Label -->
  <text x="200" y="312" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">MC: wait for episode end, update using full return G₀</text>
</g>
</svg>