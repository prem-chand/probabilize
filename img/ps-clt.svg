  <line x1="225" y1="185" x2="225" y2="40" stroke="var(--border-subtle)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M110 165 C 175 165, 195 66, 225 66 C 255 66, 275 165, 340 165" stroke="var(--figure-structure)" stroke-width="2" fill="none" opacity="0.6"/>
