<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="240" viewBox="0 0 460 240">
<rect width="460" height="240" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(0 12.34) scale(0.9787)">
  
  <defs>
    <marker id="gmVaeArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="var(--text-muted)"/></marker>
  </defs>
  <rect x="20" y="80" width="92" height="58" rx="8" fill="var(--figure-structure)" fill-opacity="0.2" stroke="var(--figure-structure)" stroke-width="1.5"/>
  <text x="66" y="114" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="11">encoder</text>
  <rect x="150" y="70" width="86" height="36" rx="6" fill="var(--figure-accent)" fill-opacity="0.2" stroke="var(--figure-accent)" stroke-width="1.5"/>
  <text x="193" y="93" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="10">μ, log σ²</text>
  <circle cx="285" cy="109" r="24" fill="var(--figure-flow)" fill-opacity="0.2" stroke="var(--figure-flow)" stroke-width="1.5"/>
  <text x="285" y="114" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="12">z</text>
  <rect x="356" y="80" width="94" height="58" rx="8" fill="var(--figure-structure)" fill-opacity="0.2" stroke="var(--figure-structure)" stroke-width="1.5"/>
  <text x="403" y="114" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="11">decoder</text>
  <g stroke="var(--text-muted)" stroke-width="2">
    <line x1="112" y1="109" x2="150" y2="96" marker-end="url(#gmVaeArrow)"/>
    <line x1="236" y1="95" x2="261" y2="101" marker-end="url(#gmVaeArrow)"/>
    <line x1="309" y1="109" x2="356" y2="109" marker-end="url(#gmVaeArrow)"/>
  </g>
  <line x1="285" y1="20" x2="285" y2="85" stroke="var(--figure-alert)" stroke-width="2" marker-end="url(#gmVaeArrow)"/>
  <text x="300" y="46" fill="var(--figure-alert)" font-family="var(--font-mono)" font-size="10">ε ~ N(0, I)</text>
  <text x="235" y="176" text-anchor="middle" fill="var(--figure-flow)" font-family="var(--font-mono)" font-size="11">z = μ + σ ⊙ ε</text>
  <text x="235" y="196" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">sampling is now differentiable in μ, σ — gradients flow through ε</text>
</g>
</svg>