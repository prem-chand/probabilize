<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" fill="none">
  <rect width="460" height="220" fill="var(--surface-sunken, #07090c)" rx="14"/>
  <line x1="50" y1="165" x2="420" y2="165" stroke="var(--border-default, #343a48)" stroke-width="1.4"/>
  <path d="M60 162 C 130 160, 175 66, 215 64 C 255 62, 300 150, 410 162" stroke="#5879fb" stroke-width="1.8" fill="none" opacity="0.75"/>
  <path d="M60 150 C 110 150, 150 118, 195 118 C 250 118, 290 150, 410 158" stroke="#f5a623" stroke-width="1.6" fill="none" opacity="0.7"/>
  <path d="M60 162 C 120 160, 160 84, 196 78 C 240 70, 300 150, 410 162" stroke="#16a36b" stroke-width="2.2" fill="none"/>
  <line x1="196" y1="78" x2="196" y2="165" stroke="#16a36b" stroke-width="1.4" stroke-dasharray="4 4"/>
  <circle cx="196" cy="78" r="4.5" fill="#16a36b"/>
  <text x="196" y="66" text-anchor="middle" fill="#16a36b" font-family="monospace" font-size="10">MAP: argmax</text>
  <text x="330" y="86" fill="#5879fb" font-family="monospace" font-size="10">likelihood</text>
  <text x="330" y="132" fill="#f5a623" font-family="monospace" font-size="10">prior</text>
  <text x="330" y="150" fill="#16a36b" font-family="monospace" font-size="10">posterior ∝ prior × likelihood</text>
  <text x="230" y="26" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="11">MAP adds a prior, pulling the estimate away from the MLE</text>
  <text x="230" y="202" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">a prior is regularisation: it shrinks toward prior belief, not away from it</text>
</svg>
