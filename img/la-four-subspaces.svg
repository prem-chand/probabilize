<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="fourSubspacesTitle fourSubspacesDesc" fill="none">
  <title id="fourSubspacesTitle">The four fundamental subspaces of A</title>
  <desc id="fourSubspacesDesc">Two stages show A mapping row space in R n to column space in R m and null space to zero, followed by the row-null and column-left-null orthogonal complement pairs.</desc>

  <defs>
    <marker id="fourSubspacesBlueArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 3.5 L0 7 Z" fill="var(--figure-structure)"/>
    </marker>
    <marker id="fourSubspacesMutedArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 3.5 L0 7 Z" fill="var(--text-muted)"/>
    </marker>
  </defs>

  <rect width="640" height="360" rx="14" fill="var(--surface-sunken)"/>

  <!-- Stage 1: the map and its kernel behavior -->
  <text x="28" y="28" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="12" font-weight="600">1 · A: Rⁿ → Rᵐ</text>
  <text x="612" y="28" text-anchor="end" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">domain → codomain</text>

  <rect x="28" y="42" width="584" height="112" rx="10" stroke="var(--border-default)"/>
  <line x1="250" y1="51" x2="250" y2="145" stroke="var(--border-subtle)"/>
  <line x1="390" y1="51" x2="390" y2="145" stroke="var(--border-subtle)"/>

  <text x="139" y="64" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">input space</text>
  <text x="320" y="64" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">linear map</text>
  <text x="501" y="64" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">output space</text>

  <rect x="48" y="75" width="182" height="28" rx="6" fill="var(--surface-raised)" fill-opacity="0.22" stroke="var(--figure-structure)"/>
  <text x="139" y="93" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="12">C(Aᵀ) · dim r</text>
  <line x1="250" y1="89" x2="390" y2="89" stroke="var(--figure-structure)" stroke-width="2" marker-end="url(#fourSubspacesBlueArrow)"/>
  <text x="320" y="83" text-anchor="middle" fill="var(--figure-structure)" font-family="var(--font-mono)" font-size="12" font-weight="600">A</text>
  <rect x="410" y="75" width="182" height="28" rx="6" fill="var(--surface-raised)" fill-opacity="0.22" stroke="var(--figure-structure)"/>
  <text x="501" y="93" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="12">C(A) · dim r</text>

  <rect x="48" y="113" width="182" height="28" rx="6" fill="var(--surface-raised)" fill-opacity="0.18" stroke="var(--figure-accent)"/>
  <text x="139" y="131" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="12">N(A) · dim n−r</text>
  <line x1="250" y1="127" x2="390" y2="127" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#fourSubspacesMutedArrow)"/>
  <text x="320" y="121" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="11">A</text>
  <rect x="410" y="113" width="182" height="28" rx="6" fill="var(--surface-raised)" stroke="var(--border-default)"/>
  <text x="501" y="131" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="12">0 ∈ Rᵐ</text>

  <!-- Stage 2: orthogonal complement pairs -->
  <text x="28" y="183" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="12" font-weight="600">2 · orthogonal-complement pairs</text>
  <text x="612" y="183" text-anchor="end" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">each pair lives in one ambient space</text>

  <rect x="28" y="197" width="282" height="135" rx="10" stroke="var(--border-default)"/>
  <text x="48" y="220" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="11">ambient space: Rⁿ</text>
  <rect x="48" y="233" width="104" height="58" rx="7" fill="var(--surface-raised)" fill-opacity="0.22" stroke="var(--figure-structure)"/>
  <text x="100" y="258" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="12">row space</text>
  <text x="100" y="276" text-anchor="middle" fill="var(--figure-structure)" font-family="var(--font-mono)" font-size="11">C(Aᵀ), r</text>
  <text x="169" y="268" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="12">⟂</text>
  <rect x="186" y="233" width="104" height="58" rx="7" fill="var(--surface-raised)" fill-opacity="0.18" stroke="var(--figure-accent)"/>
  <text x="238" y="258" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="12">null space</text>
  <text x="238" y="276" text-anchor="middle" fill="var(--figure-accent)" font-family="var(--font-mono)" font-size="11">N(A), n−r</text>

  <rect x="330" y="197" width="282" height="135" rx="10" stroke="var(--border-default)"/>
  <text x="350" y="220" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="11">ambient space: Rᵐ</text>
  <rect x="350" y="233" width="104" height="58" rx="7" fill="var(--surface-raised)" fill-opacity="0.22" stroke="var(--figure-structure)"/>
  <text x="402" y="258" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="12">column space</text>
  <text x="402" y="276" text-anchor="middle" fill="var(--figure-structure)" font-family="var(--font-mono)" font-size="11">C(A), r</text>
  <text x="471" y="268" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="12">⟂</text>
  <rect x="488" y="233" width="104" height="58" rx="7" fill="var(--surface-raised)" fill-opacity="0.18" stroke="var(--figure-accent)"/>
  <text x="540" y="258" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="12">left null</text>
  <text x="540" y="276" text-anchor="middle" fill="var(--figure-accent)" font-family="var(--font-mono)" font-size="11">N(Aᵀ), m−r</text>

  <text x="320" y="348" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">rank r is shared by row space and column space</text>
</svg>
