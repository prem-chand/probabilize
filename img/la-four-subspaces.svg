<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" fill="none">
  <rect width="480" height="300" fill="var(--surface-sunken, #07090c)" rx="14"/>
  <defs>
    <marker id="laFsBrand" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#5879fb"/></marker>
  </defs>
  <rect x="20" y="50" width="180" height="200" rx="10" stroke="var(--border-default, #343a48)" stroke-width="1.5"/>
  <text x="110" y="42" text-anchor="middle" fill="var(--text-strong, #ffffff)" font-family="monospace" font-size="12">R^n  (domain)</text>
  <rect x="35" y="70" width="150" height="70" rx="8" fill="#5879fb" fill-opacity="0.18" stroke="#5879fb" stroke-width="1.5"/>
  <text x="110" y="100" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">row space C(Aᵀ)</text>
  <text x="110" y="120" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">dim r</text>
  <rect x="35" y="165" width="150" height="65" rx="8" fill="#f5a623" fill-opacity="0.16" stroke="#f5a623" stroke-width="1.5"/>
  <text x="110" y="192" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">null space N(A)</text>
  <text x="110" y="212" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">dim n − r</text>
  <text x="110" y="153" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="12">⊥</text>
  <rect x="280" y="50" width="180" height="200" rx="10" stroke="var(--border-default, #343a48)" stroke-width="1.5"/>
  <text x="370" y="42" text-anchor="middle" fill="var(--text-strong, #ffffff)" font-family="monospace" font-size="12">R^m  (codomain)</text>
  <rect x="295" y="70" width="150" height="70" rx="8" fill="#5879fb" fill-opacity="0.18" stroke="#5879fb" stroke-width="1.5"/>
  <text x="370" y="100" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">column space C(A)</text>
  <text x="370" y="120" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">dim r</text>
  <rect x="295" y="165" width="150" height="65" rx="8" fill="#f5a623" fill-opacity="0.16" stroke="#f5a623" stroke-width="1.5"/>
  <text x="370" y="192" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">left null N(Aᵀ)</text>
  <text x="370" y="212" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">dim m − r</text>
  <text x="370" y="153" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="12">⊥</text>
  <line x1="200" y1="105" x2="280" y2="105" stroke="#5879fb" stroke-width="2" marker-end="url(#laFsBrand)"/>
  <text x="240" y="96" text-anchor="middle" fill="#5879fb" font-family="monospace" font-size="12">A</text>
  <line x1="200" y1="197" x2="280" y2="197" stroke="var(--border-default, #343a48)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="240" y="188" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="11">→ 0</text>
  <text x="240" y="280" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">A maps the row space onto the column space; the null space collapses to 0</text>
</svg>
