<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" fill="none">
  <rect width="440" height="250" fill="var(--surface-sunken, #07090c)" rx="14"/>
  <defs>
    <marker id="paConPull" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#16a36b"/></marker>
    <marker id="paConPush" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#e5484d"/></marker>
  </defs>
  <circle cx="180" cy="120" r="9" fill="#16a36b"/>
  <circle cx="225" cy="106" r="9" fill="#16a36b"/>
  <circle cx="330" cy="70" r="9" fill="#e5484d"/>
  <circle cx="352" cy="150" r="9" fill="#e5484d"/>
  <circle cx="300" cy="196" r="9" fill="#e5484d"/>
  <line x1="180" y1="120" x2="225" y2="106" stroke="#16a36b" stroke-width="2"/>
  <g stroke="#e5484d" stroke-width="1.6" stroke-dasharray="5 4">
    <line x1="180" y1="120" x2="330" y2="70" marker-end="url(#paConPush)"/>
    <line x1="180" y1="120" x2="352" y2="150" marker-end="url(#paConPush)"/>
    <line x1="180" y1="120" x2="300" y2="196" marker-end="url(#paConPush)"/>
  </g>
  <text x="230" y="24" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="11">contrastive pretraining: pull positives, push negatives apart</text>
  <text x="196" y="96" fill="#16a36b" font-family="monospace" font-size="10">positive pair</text>
  <text x="356" y="62" fill="#e5484d" font-family="monospace" font-size="10">negatives</text>
  <text x="225" y="228" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">no labels required — augmentations define what should stay invariant</text>
</svg>
