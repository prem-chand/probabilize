<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="300" viewBox="0 0 460 300">
<rect width="460" height="300" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(0 3)">
  
  <defs>
    <marker id="paAgArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="var(--text-muted)"/></marker>
  </defs>
  <rect x="160" y="40" width="150" height="58" rx="8" fill="var(--figure-structure)" fill-opacity="0.2" stroke="var(--figure-structure)" stroke-width="1.5"/>
  <text x="235" y="66" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="11">observe</text>
  <text x="235" y="84" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">image + text state</text>
  <rect x="330" y="150" width="118" height="58" rx="8" fill="var(--figure-accent)" fill-opacity="0.18" stroke="var(--figure-accent)" stroke-width="1.5"/>
  <text x="389" y="176" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="11">reason</text>
  <text x="389" y="194" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">ReAct thought</text>
  <rect x="20" y="150" width="118" height="58" rx="8" fill="var(--figure-flow)" fill-opacity="0.2" stroke="var(--figure-flow)" stroke-width="1.5"/>
  <text x="79" y="176" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="11">act</text>
  <text x="79" y="194" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">tool / API call</text>
  <rect x="170" y="220" width="130" height="44" rx="8" fill="var(--border-default)" fill-opacity="0.45" stroke="var(--border-default)" stroke-width="1.5"/>
  <text x="235" y="247" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="10">observation</text>
  <g stroke="var(--text-muted)" stroke-width="2">
    <line x1="310" y1="92" x2="372" y2="150" marker-end="url(#paAgArrow)"/>
    <line x1="330" y1="179" x2="138" y2="179" marker-end="url(#paAgArrow)"/>
    <line x1="79" y1="208" x2="200" y2="220" marker-end="url(#paAgArrow)"/>
    <line x1="270" y1="220" x2="250" y2="98" marker-end="url(#paAgArrow)"/>
  </g>
  <text x="230" y="24" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="11">a VLM agent loops: observe, reason, act, then fold back in</text>
  <text x="230" y="278" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">the loop is a POMDP policy over grounded observations</text>
</g>
</svg>