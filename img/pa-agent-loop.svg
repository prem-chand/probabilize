<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 294" fill="none">
  <rect width="460" height="294" fill="var(--surface-sunken, #07090c)" rx="14"/>
  <defs>
    <marker id="paAgArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#9aa3b2"/></marker>
  </defs>
  <rect x="160" y="40" width="150" height="58" rx="8" fill="#5879fb" fill-opacity="0.2" stroke="#5879fb" stroke-width="1.6"/>
  <text x="235" y="66" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">observe</text>
  <text x="235" y="84" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="9">image + text state</text>
  <rect x="330" y="150" width="118" height="58" rx="8" fill="#f5a623" fill-opacity="0.18" stroke="#f5a623" stroke-width="1.6"/>
  <text x="389" y="176" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">reason</text>
  <text x="389" y="194" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="9">ReAct thought</text>
  <rect x="20" y="150" width="118" height="58" rx="8" fill="#16a36b" fill-opacity="0.2" stroke="#16a36b" stroke-width="1.6"/>
  <text x="79" y="176" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">act</text>
  <text x="79" y="194" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="9">tool / API call</text>
  <rect x="170" y="220" width="130" height="44" rx="8" fill="var(--border-default, #343a48)" fill-opacity="0.45" stroke="var(--border-default, #343a48)" stroke-width="1.4"/>
  <text x="235" y="247" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10">observation</text>
  <g stroke="#9aa3b2" stroke-width="1.8">
    <line x1="310" y1="92" x2="372" y2="150" marker-end="url(#paAgArrow)"/>
    <line x1="330" y1="179" x2="138" y2="179" marker-end="url(#paAgArrow)"/>
    <line x1="79" y1="208" x2="200" y2="220" marker-end="url(#paAgArrow)"/>
    <line x1="270" y1="220" x2="250" y2="98" marker-end="url(#paAgArrow)"/>
  </g>
  <text x="230" y="24" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="11">a VLM agent loops: observe, reason, act, then fold back in</text>
  <text x="230" y="278" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="10">the loop is a POMDP policy over grounded observations</text>
</svg>
