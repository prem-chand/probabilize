<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 210" fill="none">
  <rect width="460" height="210" fill="var(--surface-sunken, #07090c)" rx="14"/>
  <text x="230" y="24" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="11">how much say does each number get?</text>

  <!-- row 1: precise sensor -->
  <text x="24" y="66" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="9">precise sensor (spread 0.2 m)</text>
  <rect x="200" y="48" width="48" height="28" rx="4" fill="#5879fb" fill-opacity="0.35" stroke="#5879fb" stroke-width="1.2"/>
  <text x="224" y="67" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10">20%</text>
  <rect x="248" y="48" width="192" height="28" rx="4" fill="#f5a623" fill-opacity="0.35" stroke="#f5a623" stroke-width="1.2"/>
  <text x="344" y="67" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10">80%</text>

  <!-- row 2: noisy sensor -->
  <text x="24" y="114" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="9">noisy sensor (spread 0.8 m)</text>
  <rect x="200" y="96" width="192" height="28" rx="4" fill="#5879fb" fill-opacity="0.35" stroke="#5879fb" stroke-width="1.2"/>
  <text x="296" y="115" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10">80%</text>
  <rect x="392" y="96" width="48" height="28" rx="4" fill="#f5a623" fill-opacity="0.35" stroke="#f5a623" stroke-width="1.2"/>
  <text x="416" y="115" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10">20%</text>

  <!-- legend -->
  <rect x="24" y="143" width="16" height="14" rx="3" fill="#5879fb" fill-opacity="0.35" stroke="#5879fb" stroke-width="1.2"/>
  <text x="46" y="154" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="9">prediction</text>
  <rect x="140" y="143" width="16" height="14" rx="3" fill="#f5a623" fill-opacity="0.35" stroke="#f5a623" stroke-width="1.2"/>
  <text x="162" y="154" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="9">measurement</text>

  <text x="230" y="184" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="9">both rows share the same prediction uncertainty (0.4 m)</text>
  <text x="230" y="200" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="9">twice as precise means four times the say</text>
</svg>
