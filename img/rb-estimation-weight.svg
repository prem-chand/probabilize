<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="240" viewBox="0 0 460 240">
<rect width="460" height="240" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(0 15)">
  
  <text x="230" y="24" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="11">how much say does each number get?</text>

  <!-- row 1: precise sensor -->
  <text x="24" y="66" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">precise sensor (spread 0.2 m)</text>
  <rect x="200" y="48" width="48" height="28" rx="4" fill="var(--figure-structure)" fill-opacity="0.35" stroke="var(--figure-structure)" stroke-width="1.5"/>
  <text x="224" y="67" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="10">20%</text>
  <rect x="248" y="48" width="192" height="28" rx="4" fill="var(--figure-accent)" fill-opacity="0.35" stroke="var(--figure-accent)" stroke-width="1.5"/>
  <text x="344" y="67" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="10">80%</text>

  <!-- row 2: noisy sensor -->
  <text x="24" y="114" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">noisy sensor (spread 0.8 m)</text>
  <rect x="200" y="96" width="192" height="28" rx="4" fill="var(--figure-structure)" fill-opacity="0.35" stroke="var(--figure-structure)" stroke-width="1.5"/>
  <text x="296" y="115" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="10">80%</text>
  <rect x="392" y="96" width="48" height="28" rx="4" fill="var(--figure-accent)" fill-opacity="0.35" stroke="var(--figure-accent)" stroke-width="1.5"/>
  <text x="416" y="115" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="10">20%</text>

  <!-- legend -->
  <rect x="24" y="143" width="16" height="14" rx="3" fill="var(--figure-structure)" fill-opacity="0.35" stroke="var(--figure-structure)" stroke-width="1.5"/>
  <text x="46" y="154" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">prediction</text>
  <rect x="140" y="143" width="16" height="14" rx="3" fill="var(--figure-accent)" fill-opacity="0.35" stroke="var(--figure-accent)" stroke-width="1.5"/>
  <text x="162" y="154" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">measurement</text>

  <text x="230" y="184" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">both rows share the same prediction uncertainty (0.4 m)</text>
  <text x="230" y="200" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">twice as precise means four times the say</text>
</g>
</svg>