<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 230" fill="none">
  <rect width="450" height="230" fill="var(--surface-sunken, #07090c)" rx="14"/>
  <defs>
    <marker id="gmElboArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#9aa3b2"/></marker>
  </defs>
  <circle cx="70" cy="115" r="26" fill="#5879fb" fill-opacity="0.2" stroke="#5879fb" stroke-width="1.6"/>
  <text x="70" y="120" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="13">z</text>
  <rect x="240" y="86" width="150" height="58" rx="8" fill="#16a36b" fill-opacity="0.2" stroke="#16a36b" stroke-width="1.6"/>
  <text x="315" y="112" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">decoder p(x|z)</text>
  <text x="315" y="130" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="9">generates data</text>
  <line x1="96" y1="115" x2="240" y2="115" stroke="#9aa3b2" stroke-width="2" marker-end="url(#gmElboArrow)"/>
  <text x="168" y="106" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="9">sample</text>
  <path d="M240 158 C 180 200, 120 200, 70 141" stroke="#f5a623" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#gmElboArrow)"/>
  <text x="150" y="212" text-anchor="middle" fill="#f5a623" font-family="monospace" font-size="10">inference q(z|x) — approximate posterior</text>
  <text x="225" y="30" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="11">latent variable model: z generates x, but p(x) is intractable</text>
  <text x="225" y="52" text-anchor="middle" fill="#16a36b" font-family="monospace" font-size="10">ELBO = E_q[log p(x|z)] − KL(q(z|x) ‖ p(z))</text>
  <text x="225" y="68" text-anchor="middle" fill="var(--text-muted, #9aa3b2)" font-family="monospace" font-size="9">reconstruction term minus a complexity penalty</text>
</svg>
