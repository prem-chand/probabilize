<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="460" height="240" viewBox="0 0 460 240">
<rect width="460" height="240" rx="10" fill="var(--surface-sunken)"/>
<g transform="translate(5 5)">
  
  <defs>
    <marker id="gmElboArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="var(--text-muted)"/></marker>
  </defs>
  <circle cx="70" cy="115" r="26" fill="var(--figure-structure)" fill-opacity="0.2" stroke="var(--figure-structure)" stroke-width="1.5"/>
  <text x="70" y="120" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="12">z</text>
  <rect x="240" y="86" width="150" height="58" rx="8" fill="var(--figure-flow)" fill-opacity="0.2" stroke="var(--figure-flow)" stroke-width="1.5"/>
  <text x="315" y="112" text-anchor="middle" fill="var(--text-strong)" font-family="var(--font-mono)" font-size="11">decoder p(x|z)</text>
  <text x="315" y="130" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">generates data</text>
  <line x1="96" y1="115" x2="240" y2="115" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#gmElboArrow)"/>
  <text x="168" y="106" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">sample</text>
  <path d="M240 158 C 180 200, 120 200, 70 141" stroke="var(--figure-accent)" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#gmElboArrow)"/>
  <text x="150" y="212" text-anchor="middle" fill="var(--figure-accent)" font-family="var(--font-mono)" font-size="10">inference q(z|x) — approximate posterior</text>
  <text x="225" y="30" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="11">latent variable model: z generates x, but p(x) is intractable</text>
  <text x="225" y="52" text-anchor="middle" fill="var(--figure-flow)" font-family="var(--font-mono)" font-size="10">ELBO = E_q[log p(x|z)] − KL(q(z|x) ‖ p(z))</text>
  <text x="225" y="68" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="10">reconstruction term minus a complexity penalty</text>
</g>
</svg>